<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>맞춤 계산기</title>
<meta name="description" content="품목별 기준값을 등록해 쓰는 맞춤 계산기">
<meta name="theme-color" content="#e8e6df" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121311" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="맞춤 계산기">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23262823'/%3E%3Crect x='12' y='10' width='40' height='16' rx='4' fill='%23c8d3b9'/%3E%3Crect x='12' y='32' width='10' height='9' rx='3' fill='%23f2f1ec'/%3E%3Crect x='27' y='32' width='10' height='9' rx='3' fill='%23f2f1ec'/%3E%3Crect x='42' y='32' width='10' height='22' rx='3' fill='%23e8742a'/%3E%3Crect x='12' y='45' width='10' height='9' rx='3' fill='%23f2f1ec'/%3E%3Crect x='27' y='45' width='10' height='9' rx='3' fill='%23f2f1ec'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #e8e6df;
  --surface: #f7f6f2;
  --surface-2: #efeee8;
  --ink: #1c1d1a;
  --muted: #6c6e66;
  --line: #d9d7ce;
  --key: #ffffff;
  --key-ink: #1c1d1a;
  --key-shadow: #c9c7bd;
  --fn: #e4e2d9;
  --accent: #e8742a;
  --accent-press: #b9581b;
  --accent-soft: #f9e2d0;
  --lcd: #c8d3b9;
  --lcd-ink: #1d2a18;
  --lcd-dim: #5f6e55;
  --danger: #c43d2f;
  --danger-soft: #f6dcd8;
  --ok: #2f7d4a;
  --overlay: rgba(28, 29, 26, .42);
  --tc-bg: #dfe8d3; --tc-fg: #33502a; --tf-bg: #dde4ef; --tf-fg: #2b4166; --tb-bg: #f4e2cf; --tb-fg: #77461c;
  --shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 12px 32px rgba(40, 38, 30, .10);
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "D2Coding", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121311; --surface: #1d1f1b; --surface-2: #252722; --ink: #ecebe5; --muted: #9b9d94; --line: #34372f;
    --key: #2c2f29; --key-ink: #ecebe5; --key-shadow: #121310; --fn: #3a3d36; --accent: #f08436; --accent-press: #a8561c;
    --accent-soft: #42301f; --lcd: #1b2517; --lcd-ink: #c4e8a0; --lcd-dim: #7f9b6a; --danger: #ef6a5a; --danger-soft: #3d221f;
    --ok: #6cc58b; --overlay: rgba(0,0,0,.6); --tc-bg: #27331f; --tc-fg: #b5d69a; --tf-bg: #232c3b; --tf-fg: #a9c0e6; --tb-bg: #3a2c1e; --tb-fg: #eebf8c; --shadow: 0 12px 32px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121311; --surface: #1d1f1b; --surface-2: #252722; --ink: #ecebe5; --muted: #9b9d94; --line: #34372f;
  --key: #2c2f29; --key-ink: #ecebe5; --key-shadow: #121310; --fn: #3a3d36; --accent: #f08436; --accent-press: #a8561c;
  --accent-soft: #42301f; --lcd: #1b2517; --lcd-ink: #c4e8a0; --lcd-dim: #7f9b6a; --danger: #ef6a5a; --danger-soft: #3d221f;
  --ok: #6cc58b; --overlay: rgba(0,0,0,.6); --tc-bg: #27331f; --tc-fg: #b5d69a; --tf-bg: #232c3b; --tf-fg: #a9c0e6; --tb-bg: #3a2c1e; --tb-fg: #eebf8c; --shadow: 0 12px 32px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.shell {
  max-width: 480px; margin: 0 auto;
  padding-block: 12px calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.shell.wide { max-width: 760px; }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 8px; min-height: 52px; margin-bottom: 8px; }
.topbar h1 { flex: 1; min-width: 0; margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { flex: none; font-size: 22px; }
.logo { width: 34px; height: 34px; border-radius: 9px; flex: none; display: block; }
.icon-btn {
  width: 42px; height: 42px; flex: none; display: inline-grid; place-items: center;
  border: 0; border-radius: 12px; background: transparent; color: var(--ink);
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn[aria-pressed="true"] { background: var(--fn); color: var(--ink); }
.icon-btn svg { width: 22px; height: 22px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 44px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--key); color: var(--ink); font-weight: 600; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.danger { color: var(--danger); border-color: var(--danger-soft); background: transparent; }
.btn.danger.solid { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }

/* ---------- home ---------- */
.home-sub { margin: 0 0 16px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card {
  position: relative; display: flex; flex-direction: column; min-height: 150px; padding: 14px;
  border-radius: 18px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow);
  text-align: left; color: var(--ink); transition: transform .12s ease;
}
.card:active { transform: scale(.985); }
.card-open { position: absolute; inset: 0; border: 0; background: transparent; border-radius: 18px; }
.card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; pointer-events: none; }
.card-top .icon-btn { pointer-events: auto; position: relative; width: 34px; height: 34px; margin: -6px -6px -6px 0; }
.card-name { font-size: 16px; font-weight: 700; line-height: 1.3; margin: 0 0 4px; overflow-wrap: anywhere; pointer-events: none; }
.card-meta { margin-top: auto; font-size: 13px; color: var(--muted); pointer-events: none; }
.badge {
  display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px;
  font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--ink); white-space: nowrap; flex: none;
}
.badge svg { width: 13px; height: 13px; }
.badge.t-convert, .type-ico.t-convert { background: var(--tc-bg); color: var(--tc-fg); }
.badge.t-formula, .type-ico.t-formula { background: var(--tf-bg); color: var(--tf-fg); }
.badge.t-blend, .type-ico.t-blend { background: var(--tb-bg); color: var(--tb-fg); }
.card.add {
  align-items: center; justify-content: center; gap: 8px; box-shadow: none; background: transparent;
  border: 2px dashed var(--line); color: var(--muted); font-weight: 600;
}
.card.add:hover { border-color: var(--accent); color: var(--accent); }
.card.add svg { width: 28px; height: 28px; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }

/* ---------- device (calculator body) ---------- */
.device {
  background: var(--surface); border: 1px solid var(--line); border-radius: 26px;
  padding: 14px; box-shadow: var(--shadow);
}
.lcd {
  position: relative; background: var(--lcd); color: var(--lcd-ink); border-radius: 14px;
  padding: 12px 14px 12px; min-height: 132px; display: flex; flex-direction: column;
  box-shadow: inset 0 2px 7px rgba(0,0,0,.22), inset 0 0 0 1px rgba(0,0,0,.06);
  font-family: var(--mono); font-variant-numeric: tabular-nums;
}
.lcd-top { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--lcd-dim); padding-right: 34px; }
.lcd-top span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lcd-expr { margin-top: auto; min-height: 20px; text-align: right; font-size: 14px; color: var(--lcd-dim); overflow-wrap: anywhere; }
.lcd-main { display: flex; justify-content: flex-end; align-items: baseline; gap: 8px; text-align: right; line-height: 1.1; }
.lcd-main .num { font-size: clamp(32px, 10vw, 46px); font-weight: 600; letter-spacing: .01em; overflow-wrap: anywhere; min-width: 0; }
.lcd-main .unit { font-size: 18px; font-weight: 600; flex: none; }
.lcd-main.dim { color: var(--lcd-dim); }
.lcd-main.err .num { font-size: 22px; }
.lcd-rows { margin-top: 8px; padding-top: 7px; border-top: 1px dashed color-mix(in srgb, var(--lcd-ink) 30%, transparent); display: grid; gap: 2px; font-size: 14px; }
.lcd-row { display: flex; justify-content: space-between; gap: 10px; }
.lcd-row b { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
.lcd-copy {
  position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border: 0; border-radius: 9px;
  background: transparent; color: var(--lcd-dim); display: grid; place-items: center;
}
.lcd-copy:hover { background: color-mix(in srgb, var(--lcd-ink) 12%, transparent); color: var(--lcd-ink); }
.lcd-copy svg { width: 17px; height: 17px; }

.panel { margin-top: 14px; display: grid; gap: 12px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel-head h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
.link-btn { border: 0; background: none; padding: 4px 2px; font-size: 13px; font-weight: 600; color: var(--accent); }
.link-btn:hover { text-decoration: underline; }

.field-label { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 2px 5px; font-size: 13px; color: var(--muted); font-weight: 600; }
.field-label .key-tag { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 0 6px; }
.input-wrap {
  display: flex; align-items: center; background: var(--key); border: 1.5px solid var(--line);
  border-radius: 13px; height: 54px; padding: 0 14px; transition: border-color .12s, box-shadow .12s;
}
.input-wrap:focus-within, .input-wrap.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input-wrap.bad { border-color: var(--danger); }
.input-wrap input {
  flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; outline: none;
  font: 600 22px var(--mono); text-align: right; color: var(--ink); font-variant-numeric: tabular-nums;
}
.input-wrap input::placeholder { color: var(--line); }
.input-wrap .unit { margin-left: 8px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.input-wrap.sm { height: 44px; border-radius: 11px; padding: 0 10px; }
.input-wrap.sm input { font-size: 17px; }
.input-wrap.sm .unit { font-size: 13px; }

.dir { display: grid; place-items: center; height: 18px; color: var(--muted); }
.dir svg { width: 18px; height: 18px; transition: transform .18s ease; }
.dir.up svg { transform: rotate(180deg); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--key);
  font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
}
.chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip:hover { border-color: var(--muted); }
.chip[aria-checked="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip.add { border-style: dashed; color: var(--muted); background: transparent; }
.chip.add:hover { color: var(--accent); border-color: var(--accent); }
.chip svg { width: 16px; height: 16px; }
.search {
  width: 100%; height: 40px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--key);
  padding: 0 12px; outline: none;
}
.search:focus { border-color: var(--accent); }
.notice { padding: 16px; border-radius: 14px; background: var(--surface-2); color: var(--muted); text-align: center; display: grid; gap: 10px; justify-items: center; }

/* blend rows */
.brows { display: grid; gap: 10px; }
.brow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 36px; gap: 8px; align-items: center; padding: 10px; border-radius: 14px; background: var(--surface-2); }
.brow > .select { grid-column: 1 / 3; grid-row: 1; }
.brow > .del { grid-column: 3; grid-row: 1; }
.brow > .amount { grid-column: 1 / 3; grid-row: 2; }
.brow.has-custom > .amount { grid-column: 2 / 3; }
.brow > .custom { grid-column: 1 / 2; grid-row: 2; }
.brow-meta { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); font-family: var(--mono); margin: -2px 2px 0; }
.select {
  width: 100%; height: 44px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--key);
  padding: 0 10px; font-weight: 600; outline: none; min-width: 0;
}
.select:focus { border-color: var(--accent); }
.mini-btn { width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); display: grid; place-items: center; }
.mini-btn:hover { background: var(--fn); color: var(--ink); }
.mini-btn.del:hover { color: var(--danger); background: var(--danger-soft); }
.mini-btn svg { width: 18px; height: 18px; }

/* keypad */
.keypad-wrap { margin-top: 14px; }
.keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.key {
  height: 54px; border: 0; border-radius: 14px; background: var(--key); color: var(--key-ink);
  font: 600 22px var(--sans); box-shadow: 0 3px 0 var(--key-shadow), 0 1px 3px rgba(0,0,0,.06);
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
  transition: transform .05s, box-shadow .05s;
}
.key:active, .key.pressed { transform: translateY(3px); box-shadow: 0 0 0 var(--key-shadow); }
.key.fn { background: var(--fn); font-size: 17px; }
.key.op { background: var(--accent); color: #fff; box-shadow: 0 3px 0 var(--accent-press); }
.key.op:active { box-shadow: 0 0 0 var(--accent-press); }
.key.wide { grid-column: span 2; }
.key svg { width: 24px; height: 24px; vertical-align: middle; }
.key-hint { margin: 10px 2px 0; font-size: 12px; color: var(--muted); text-align: center; }
@media (min-height: 860px) { .key { height: 60px; } }

/* ---------- editor ---------- */
.type-line { display: flex; align-items: center; gap: 8px; margin: -2px 0 14px; color: var(--muted); font-size: 13px; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.sec h2 { margin: 0 0 12px; font-size: 15px; font-weight: 700; }
.sec-head h2 { margin: 0; }
.sec .hint, .help { font-size: 12.5px; color: var(--muted); }
.help { margin: 8px 0 0; }
.f { display: grid; gap: 5px; margin-bottom: 12px; }
.f:last-child { margin-bottom: 0; }
.f > span { font-size: 13px; color: var(--muted); font-weight: 600; }
.txt {
  width: 100%; height: 44px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--key);
  padding: 0 12px; outline: none; min-width: 0;
}
.txt:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.txt.mono { font-family: var(--mono); }
.txt.invalid, .input-wrap.invalid { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
textarea.txt { height: auto; min-height: 140px; padding: 10px 12px; resize: vertical; font-family: var(--mono); font-size: 14px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 10px 10px; }
.grid2 .f { margin: 0; }
.unit-arrow { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
.unit-arrow::before, .unit-arrow::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 11px; background: var(--key); height: 44px; }
.stepper button { width: 44px; height: 100%; border: 0; background: transparent; font-size: 20px; font-weight: 600; }
.stepper output { min-width: 40px; text-align: center; font-family: var(--mono); font-weight: 600; font-size: 17px; }
.stepper-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stepper-row .preview { font-family: var(--mono); color: var(--muted); font-size: 13px; }

.erows { display: grid; gap: 8px; }
.erow {
  display: grid; grid-template-columns: minmax(0, 1fr) 132px auto; gap: 8px; align-items: center;
  padding: 8px; border-radius: 13px; background: var(--surface-2);
}
.erow .tools { display: flex; }
.erow .tools .mini-btn { width: 32px; height: 36px; }
.erow.formula-in { grid-template-columns: 58px minmax(0, 1fr) 70px auto; }
.erow.formula-out { grid-template-columns: 58px minmax(0, 1fr) 70px auto; }
.erow .full { grid-column: 1 / -1; }
.erow .txt { height: 40px; }
.erow .input-wrap.sm { height: 40px; }
.erow .key-input { text-align: center; font-family: var(--mono); font-weight: 700; padding: 0 4px; }
.vars { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.var-chip { height: 28px; padding: 0 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--key); font: 600 12.5px var(--mono); }
.var-chip:hover { border-color: var(--accent); color: var(--accent); }
.var-chip.op { color: var(--muted); }
.fmsg { font-size: 12.5px; font-family: var(--mono); color: var(--muted); }
.fmsg.err { color: var(--danger); }
.fmsg.ok { color: var(--ok); }
.row-empty { padding: 14px; text-align: center; color: var(--muted); font-size: 13.5px; border: 1.5px dashed var(--line); border-radius: 13px; }
.sec-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
@media (max-width: 420px) {
  .erow { grid-template-columns: minmax(0, 1fr) auto; }
  .erow > .name-input { grid-column: 1 / -1; }
  .erow.formula-in, .erow.formula-out { grid-template-columns: 52px minmax(0, 1fr) auto; }
  .erow.formula-in .label-input, .erow.formula-out .label-input { grid-column: 2 / -1; }
  .erow.formula-in .unit-input, .erow.formula-out .unit-input { grid-column: 1 / 3; }
}
.danger-zone { display: flex; gap: 8px; flex-wrap: wrap; }
.ed-footer { position: sticky; bottom: 0; padding: 12px 0 calc(4px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); }

/* type picker */
.type-list { display: grid; gap: 10px; }
.type-opt {
  display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; text-align: left;
  padding: 14px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--key);
}
.type-opt:hover { border-color: var(--accent); }
.type-ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
.type-ico svg { width: 24px; height: 24px; }
.type-opt b { display: block; font-size: 16px; margin-bottom: 2px; }
.type-opt span { display: block; font-size: 13.5px; color: var(--muted); }
.type-opt small { display: block; margin-top: 6px; font-size: 12.5px; color: var(--ink); opacity: .75; }

/* ---------- sheet / dialog ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 50; background: var(--overlay); display: flex; align-items: flex-end; justify-content: center;
  animation: fade .15s ease;
}
@media (min-width: 560px) { .overlay { align-items: center; padding: 16px; } }
.sheet {
  width: 100%; max-width: 480px; max-height: 88vh; overflow: auto; background: var(--surface); color: var(--ink);
  border-radius: 22px 22px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
  box-shadow: 0 -10px 40px rgba(0,0,0,.2); animation: up .2s ease;
}
@media (min-width: 560px) { .sheet { border-radius: 22px; padding-bottom: 16px; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
.sheet-head h3 { margin: 0; font-size: 17px; }
.sheet-body { padding: 4px 0 8px; }
.sheet-body p { margin: 0 0 10px; color: var(--muted); }
.sheet-actions { display: flex; gap: 8px; margin-top: 8px; }
.sheet-actions .btn { flex: 1; }
.menu { display: grid; gap: 2px; }
.menu button {
  display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 10px; border: 0; border-radius: 12px;
  background: transparent; text-align: left; font-weight: 600;
}
.menu button:hover { background: var(--surface-2); }
.menu button svg { width: 20px; height: 20px; color: var(--muted); }
.menu button.danger { color: var(--danger); }
.menu button.danger svg { color: var(--danger); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.info { font-size: 14px; color: var(--ink); }
.info h4 { margin: 14px 0 6px; font-size: 14px; }
.info ol, .info ul { margin: 0; padding-left: 20px; color: var(--muted); }
.info li { margin-bottom: 4px; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(24px); opacity: .6; } }

.toast {
  position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); z-index: 60;
  transform: translate(-50%, -16px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px;
  transition: opacity .18s, transform .18s; max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: var(--danger); color: #fff; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

   ========================================================= */

/** 붙여넣기/복사용: 쉼표 없는 숫자 */

/* =========================================================

   ========================================================= */
class CalcError extends Error {}

  round: (x, n = 0) => { const p = 10 ** n; return Math.round(x * p) / p; },
  floor: (x, n = 0) => { const p = 10 ** n; return Math.floor(x * p) / p; },
  ceil: (x, n = 0) => { const p = 10 ** n; return Math.ceil(x * p) / p; },

  log: Math.log10, ln: Math.log,

const CONST = { PI: Math.PI };
const ID_RE = /^[A-Za-z_가-힣][A-Za-z0-9_가-힣]*$/;

function normalizeOps(s) {
  return String(s).replace(/×/g, '*').replace(/÷/g, '/').replace(/[−–]/g, '-').replace(/＋/g, '+');

function tokenize(src) {

    const ch = s[i];
    if (/\s/.test(ch)) { i++; continue; }

/* =========================================================

   ========================================================= */
const navStack = [location.hash || '#/'];
function go(hash) { if (location.hash === hash) return; navStack.push(hash); location.hash = hash; }
function replaceRoute(hash) {
  const same = location.hash === hash;
  navStack[navStack.length - 1] = hash;
  if (same) render(); else location.replace(hash);
}
function up(parent) {
  if (navStack.length >= 2 && navStack[navStack.length - 2] === parent) history.back();
  else replaceRoute(parent);
}
window.addEventListener('hashchange', () => {
  const cur = location.hash || '#/';
  if (navStack.length >= 2 && navStack[navStack.length - 2] === cur) navStack.pop();
  else if (navStack[navStack.length - 1] !== cur) navStack.push(cur);
  render();
});
function parseRoute() {
  const parts = (location.hash.replace(/^#\/?/, '')).split('/').filter(Boolean).map(decodeURIComponent);

  if (parts[0] === 'edit' && parts[1]) return { name: 'edit', id: parts[1] };

  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');

    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="sheet-head"><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="닫기">${I.x}</button></div>
      <div class="sheet-body">${html}</div>
      ${actions.length ? `<div class="sheet-actions">${actions.map((a, i) => `<button class="btn ${a.kind || ''}" data-ai="${i}">${esc(a.label)}</button>`).join('')}</div>` : ''}
    </div>`;
  const run = (a) => { const r = a.onClick ? a.onClick(wrap) : undefined; if (r !== false) closeSheet(); };

    if (e.target === wrap || e.target.closest('[data-close]')) return closeSheet();
    const b = e.target.closest('[data-ai]');

    if (e.key === 'Enter' && e.target.matches('input')) {
      const primary = actions.find((a) => (a.kind || '').includes('primary'));
      if (primary) { e.preventDefault(); run(primary); }
    }
  });

  sheet = { el: wrap, lastFocus };
  onMount?.(wrap);
  if (!wrap.contains(document.activeElement)) (wrap.querySelector('input, textarea, select') || wrap.querySelector('[data-ai], .menu button') || wrap.querySelector('[data-close]'))?.focus();

  return new Promise((resolve) => {
    let done = false;
    const finish = (v) => { if (!done) { done = true; resolve(v); } };
    const el = openSheet({
      title, html: `<p>${esc(message)}</p>`,
      actions: [
        { label: '취소', onClick: () => finish(false) },
        { label: ok, kind: danger ? 'danger solid' : 'primary', onClick: () => finish(true) },
      ],
    });
    new MutationObserver((_, obs) => { if (!document.contains(el)) { obs.disconnect(); finish(false); } }).observe(document.body, { childList: true });
  });
}
function menuSheet(title, items) {
  const html = `<div class="menu">${items.map((it, i) => it === '-' ? '<hr>' : `<button data-mi="${i}" class="${it.danger ? 'danger' : ''}">${it.icon || ''}<span>${esc(it.label)}</span></button>`).join('')}</div>`;
  openSheet({
    title, html,
    onMount: (el) => el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-mi]');
      if (!b) return;
      closeSheet(false);
      items[+b.dataset.mi].onClick();
    }),
  });
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch { /* 무시 */ }
    ta.remove();
  }
  toast(`복사했어요: ${text}`);
}

const $app = document.getElementById('app');
let currentView = '';
let calcUI = null;   // { id, activeId }
let editor = null;   // { key, draft, isNew, dirty, focusNew }

function render() {
  closeSheet(false);
  const r = parseRoute();
  const viewKey = location.hash;
  const changed = viewKey !== currentView;
  currentView = viewKey;
  if (r.name === 'calc') {
    const c = getCalc(r.id);
    if (!c) return replaceRoute('#/');
    if (!calcUI || calcUI.id !== c.id) calcUI = { id: c.id, activeId: null };
    renderCalc(c);
  } else if (r.name === 'edit' || r.name === 'new') {
    if (!editor || editor.key !== viewKey) {
      if (r.name === 'edit') {
        const c = getCalc(r.id);
        if (!c) return replaceRoute('#/');
        editor = { key: viewKey, draft: toDraft(c), isNew: false, dirty: false };
      } else {
        if (!TYPES[r.type]) return replaceRoute('#/');
        editor = { key: viewKey, draft: blankDraft(r.type), isNew: true, dirty: false };
      }
    }
    renderEditor();
  } else {
    renderHome();
  }
  if (changed) window.scrollTo(0, 0);
}

function cardMenu(id) {
  const c = getCalc(id);
  if (!c) return;
  const idx = db.calcs.indexOf(c);
  const move = (d) => {
    const j = idx + d;
    if (j < 0 || j >= db.calcs.length) return;
    [db.calcs[idx], db.calcs[j]] = [db.calcs[j], db.calcs[idx]];
    persist(); render();
  };
  menuSheet(c.name, [
    { label: '편집', icon: I.edit, onClick: () => go('#/edit/' + c.id) },
    { label: '복제', icon: I.copy, onClick: () => { duplicateCalc(c); render(); } },
    ...(idx > 0 ? [{ label: '앞으로 이동', icon: I.up, onClick: () => move(-1) }] : []),
    ...(idx < db.calcs.length - 1 ? [{ label: '뒤로 이동', icon: I.down, onClick: () => move(1) }] : []),
    '-',
    { label: '삭제', icon: I.trash, danger: true, onClick: () => deleteCalc(c) },
  ]);
}
function duplicateCalc(c) {
  const copy = clone(c);
  copy.id = uid();
  copy.name = c.name + ' (복사본)';
  copy.createdAt = Date.now();
  for (const list of ['items', 'materials', 'inputs', 'outputs']) if (copy[list]) copy[list].forEach((x) => { x.id = uid(); });
  db.calcs.splice(db.calcs.indexOf(c) + 1, 0, copy);
  persist();
  toast('복제했어요');
  return copy;
}
async function deleteCalc(c, after) {
  const ok = await confirmDialog({ title: '계산기 삭제', message: `“${c.name}” 계산기와 등록된 베이스 데이터를 삭제할까요? 되돌릴 수 없어요.`, ok: '삭제', danger: true });
  if (!ok) return;
  db.calcs = db.calcs.filter((x) => x !== c);
  delete db.session[c.id];
  persist();
  toast('삭제했어요');
  if (after) after(); else render();
}

async function exportBackup() {
  const data = { app: 'custom-calculator', version: 1, exportedAt: new Date().toISOString(), calcs: db.calcs };
  const json = JSON.stringify(data, null, 2);
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  const filename = `계산기-백업-${stamp}.json`;
  // claude.ai 에서 열었을 때는 플랫폼의 다운로드 기능을 사용
  const dl = window.claude?.use ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename, data: json }); toast('백업 파일을 내보냈어요'); }
    catch (e) { if (e?.code !== 'declined') toast('이 화면에서는 파일을 저장할 수 없어요', true); }
    return;
  }
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('백업 파일을 내보냈어요');
}
function validCalc(c) {
  if (!c || typeof c !== 'object' || !TYPES[c.type] || typeof c.name !== 'string') return false;
  if (c.type === 'convert') return Array.isArray(c.items);
  if (c.type === 'formula') return Array.isArray(c.inputs) && Array.isArray(c.outputs);
  return Array.isArray(c.materials);
}
document.getElementById('importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  let calcs;
  try {
    const data = JSON.parse(await file.text());
    calcs = (Array.isArray(data) ? data : data.calcs || []).filter(validCalc);
  } catch { calcs = null; }
  if (!calcs || !calcs.length) return toast('불러올 수 있는 계산기가 없는 파일이에요', true);
  const fresh = () => calcs.map((c) => {
    const x = clone(c);
    if (db.calcs.some((y) => y.id === x.id)) x.id = uid();
    return x;
  });
  openSheet({
    title: '백업 불러오기',
    html: `<p>계산기 ${calcs.length}개를 찾았어요. 어떻게 불러올까요?</p>`,
    actions: [
      { label: '전체 바꾸기', kind: 'danger', onClick: () => { db.calcs = clone(calcs); db.session = {}; persist(); render(); toast('백업으로 바꿨어요'); } },

    ],
  });
});

function renderCalc(c) {
  const s = session(c);
  const kp = keypadOn();
  const editLabel = c.type === 'formula' ? '계산기 편집' : '베이스 데이터 · 편집';
  $app.innerHTML = `
    <div class="shell">
      <header class="topbar">
        <button class="icon-btn" data-act="up-home" aria-label="뒤로">${I.back}</button>
        <h1>${esc(c.name)}</h1>
        <button class="icon-btn" data-act="toggle-keypad" aria-pressed="${kp}" aria-label="키패드 ${kp ? '숨기기' : '보이기'}" title="키패드 ${kp ? '숨기기' : '보이기'}">${I.keypad}</button>

}
function applyInputMode() {
  const none = keypadOn() && isTouch();
  $app.querySelectorAll('.panel input[data-calc]').forEach((el) => el.setAttribute('inputmode', none ? 'none' : 'decimal'));
}
function firstCalcInput() {
  const els = [...$app.querySelectorAll('.panel input[data-calc]')];
  return els.find((e) => !e.value) || els[0] || null;
}
function getActiveInput() {
  const el = calcUI && calcUI.activeId && document.getElementById(calcUI.activeId);
  return el && document.contains(el) ? el : firstCalcInput();

function setActive(el) {
  $app.querySelectorAll('.input-wrap.active').forEach((w) => w.classList.remove('active'));

  calcUI.activeId = el.id;

function keypadHTML() {

  return `<div class="keypad-wrap"><div class="keypad" role="group" aria-label="키패드">
    ${k('AC', 'AC', 'fn', '전체 지우기')}${k('C', 'C', 'fn', '입력칸 지우기')}${k('back', I.backspace, 'fn', '한 글자 지우기')}${k('÷', '÷', 'op', '나누기')}
    ${k('7', '7')}${k('8', '8')}${k('9', '9')}${k('×', '×', 'op', '곱하기')}
    ${k('4', '4')}${k('5', '5')}${k('6', '6')}${k('−', '−', 'op', '빼기')}
    ${k('1', '1')}${k('2', '2')}${k('3', '3')}${k('+', '+', 'op', '더하기')}

/** 입력값이 바뀔 때마다 결과(LCD)와 연동 칸만 갱신 (입력칸은 다시 그리지 않음 → 커서 유지) */
function updateCalc(c) {
  const s = session(c);
  const d = c.decimals ?? 2;
  const lcd = document.getElementById('lcd');
  if (!lcd) return;
  const copyBtn = (val) => (Number.isFinite(val) ? `<button class="lcd-copy" data-act="copy" data-val="${plain(val, d)}" aria-label="결과 복사" title="결과 복사">${I.copy}</button>` : '');
  const main = (val, unit, state) => {
    if (state === 'err') return `<div class="lcd-main err"><span class="num">입력 오류</span></div>`;
    const ok = Number.isFinite(val);
    return `<div class="lcd-main${ok && state !== 'dim' ? '' : ' dim'}"><span class="num">${ok ? fmt(val, d) : (state === 'na' ? '—' : '0')}</span>${unit ? `<span class="unit">${esc(unit)}</span>` : ''}</div>`;
  };

  if (c.type === 'convert') {
    const item = c.items.find((i) => i.id === s.itemId);
    const f = item ? numOrNaN(item.factor) : NaN;
    const srcUnit = s.src === 'a' ? c.unitA : c.unitB;
    const dstUnit = s.src === 'a' ? c.unitB : c.unitA;
    const v = evalInput(s.src === 'a' ? s.a : s.b);
    const out = v.ok ? (s.src === 'a' ? v.value * f : v.value / f) : NaN;
    const other = document.getElementById(s.src === 'a' ? 'cv-b' : 'cv-a');
    if (other) other.value = v.ok && Number.isFinite(out) ? fmt(out, d) : '';
    const srcEl = document.getElementById(s.src === 'a' ? 'cv-a' : 'cv-b');
    srcEl?.closest('.input-wrap').classList.toggle('bad', !!v.error);
    document.getElementById('cv-dir')?.classList.toggle('up', s.src === 'b');
    lcd.innerHTML = `
      <div class="lcd-top"><span>${item ? esc(item.name) : '품목 없음'}</span><span>${item ? `1 ${esc(c.unitA)} = ${fmt(f, 6)} ${esc(c.unitB)}` : ''}</span></div>
      <div class="lcd-expr">${v.ok ? `${fmt(v.value, 6)} ${esc(srcUnit)} =` : ''}</div>
      ${v.error ? main(NaN, '', 'err') : main(out, dstUnit, v.ok ? (Number.isFinite(out) ? '' : 'na') : 'dim')}
      ${copyBtn(out)}`;
    return;
  }

  if (c.type === 'formula') {
    const env = Object.create(null);
    let anyErr = false, anyEmpty = false;
    for (const inp of c.inputs) {
      const r = evalInput(s.vals[inp.id] || '');
      document.getElementById('fx-' + inp.id)?.closest('.input-wrap').classList.toggle('bad', !!r.error);
      if (r.error) anyErr = true;
      if (r.empty) anyEmpty = true;
      env[inp.key] = r.ok ? r.value : NaN;
    }
    const results = c.outputs.map((o) => {
      let val = NaN;
      const comp = compile(o.formula);
      if (comp.ok) { try { val = evalAst(comp.ast, env); } catch { val = NaN; } }
      env[o.key] = val;
      return { o, val };
    });
    const [first, ...rest] = results;
    const state = anyErr ? 'err' : anyEmpty ? 'dim' : (first && !Number.isFinite(first.val) ? 'na' : '');
    lcd.innerHTML = first ? `
      <div class="lcd-top"><span>${esc(first.o.label || first.o.key)}</span><span>${anyEmpty ? '값을 입력하세요' : ''}</span></div>
      <div class="lcd-expr"></div>
      ${main(anyEmpty ? NaN : first.val, first.o.unit, state)}
      ${rest.length ? `<div class="lcd-rows">${rest.map((r) => `<div class="lcd-row"><span>${esc(r.o.label || r.o.key)}</span><b>${anyEmpty ? '—' : fmt(r.val, d)} ${esc(r.o.unit || '')}</b></div>`).join('')}</div>` : ''}
      ${anyEmpty || anyErr ? '' : copyBtn(first.val)}`
      : '<div class="lcd-top"><span>결과 항목이 없어요</span></div><div class="lcd-expr"></div>' + main(NaN, '', 'dim');
    return;
  }

  // blend
  let total = 0, part = 0, complete = 0, partial = 0, anyErr = false;
  for (const row of s.rows) {
    const mat = c.materials.find((m) => m.id === row.mat);
    const pv = row.mat === 'custom' ? evalInput(row.custom) : { ok: !!mat && Number.isFinite(numOrNaN(mat.value)), value: mat ? numOrNaN(mat.value) : NaN };
    const av = evalInput(row.amount);
    document.getElementById('bl-a-' + row.id)?.closest('.input-wrap').classList.toggle('bad', !!av.error);
    document.getElementById('bl-c-' + row.id)?.closest('.input-wrap').classList.toggle('bad', !!pv.error);
    if (av.error || pv.error) anyErr = true;
    const meta = document.getElementById('bm-' + row.id);
    if (av.ok && pv.ok) {
      const w = av.value * pv.value / 100;
      total += av.value; part += w; complete++;
      if (meta) meta.textContent = `${c.propName} ${fmt(pv.value, 4)}% → ${fmt(w, d)} ${c.amountUnit}`;
    } else {
      if (!av.empty || (row.mat === 'custom' && row.custom)) partial++;
      if (meta) meta.textContent = pv.ok ? `${c.propName} ${fmt(pv.value, 4)}%` : (row.mat === 'custom' ? `${c.propName} %를 입력하세요` : '');
    }
  }
  const pct = total > 0 ? part / total * 100 : NaN;
  const state = anyErr ? 'err' : complete ? (Number.isFinite(pct) ? '' : 'na') : 'dim';
  lcd.innerHTML = `
    <div class="lcd-top"><span>배합 ${esc(c.propName)}</span><span>${partial ? `미완성 ${partial}행 제외` : `${complete}종 배합`}</span></div>
    <div class="lcd-expr"></div>
    ${main(complete ? pct : NaN, '%', state)}
    <div class="lcd-rows">
      <div class="lcd-row"><span>총 투입량</span><b>${complete ? fmt(total, d) : '—'} ${esc(c.amountUnit)}</b></div>
      <div class="lcd-row"><span>${esc(c.propName)}량</span><b>${complete ? fmt(part, d) : '—'} ${esc(c.amountUnit)}</b></div>
    </div>
    ${complete && !anyErr ? copyBtn(pct) : ''}`;
}

/** 계산기 입력칸의 값이 바뀌었을 때 세션에 반영 */
function onCalcInput(c, el) {
  const s = session(c);
  if (c.type === 'convert') {
    s.src = el.dataset.side;
    s[s.src] = el.value;
  } else if (c.type === 'formula') {
    s.vals[el.dataset.inp] = el.value;
  } else {
    const row = s.rows.find((r) => r.id === el.dataset.row);
    if (row) row[el.dataset.bfield] = el.value;
  }
  updateCalc(c);
  persistSoon();
}
/** 식(10+5)을 결과 숫자로 확정 */
function commitExpr(c, el) {
  const r = evalInput(el.value);
  if (r.ok && r.expr) {
    el.value = plain(r.value, Math.max(6, c.decimals ?? 2));
    onCalcInput(c, el);
  }
}
function nextCalcInput(el) {
  const els = [...$app.querySelectorAll('.panel input[data-calc]')];
  const i = els.indexOf(el);
  return els[i + 1] || null;
}

function keypadPress(c, key) {
  if (key === 'AC') return clearAll(c);
  const el = getActiveInput();
  if (!el) return;
  if (document.activeElement !== el) el.focus({ preventScroll: true });
  setActive(el);
  const v = el.value;
  let s = el.selectionStart ?? v.length, e = el.selectionEnd ?? v.length;
  if (key === '=') { commitExpr(c, el); return; }
  let nv = v, caret;
  if (key === 'C') { nv = ''; caret = 0; }
  else if (key === 'back') {
    if (s !== e) { nv = v.slice(0, s) + v.slice(e); caret = s; }
    else if (s > 0) { nv = v.slice(0, s - 1) + v.slice(s); caret = s - 1; }
    else return;
  } else {
    // 결과값(다른 칸에 자동 입력된 쉼표 숫자)을 이어서 편집할 때 쉼표 제거
    if (/,/.test(v)) { const raw = v.replace(/,/g, ''); s = e = raw.length; nv = raw; }
    nv = nv.slice(0, s) + key + nv.slice(e);
    caret = s + key.length;
  }
  el.value = nv;
  try { el.setSelectionRange(caret, caret); } catch { /* 무시 */ }
  onCalcInput(c, el);
}
function clearAll(c) {
  const s = session(c);
  if (c.type === 'convert') { s.a = ''; s.b = ''; s.src = 'a'; }
  else if (c.type === 'formula') s.vals = {};
  else s.rows = [newBlendRow(c)];
  persist();
  calcUI.activeId = null;
  renderCalc(c);
}

function quickAddItem(c, onAdded) {
  const isBlend = c.type === 'blend';
  const html = isBlend

       <label class="f"><span>${esc(c.propName)} (%)</span><div class="input-wrap sm"><input id="qa-val" inputmode="decimal" placeholder="0"><span class="unit">%</span></div></label>`
    : `<label class="f"><span>품목 이름</span><input class="txt" id="qa-name" placeholder="예: 원단 C"></label>
       <label class="f"><span>기준값: 1 ${esc(c.unitA)} 당 ${esc(c.unitB)}</span><div class="input-wrap sm"><input id="qa-val" inputmode="decimal" placeholder="0"><span class="unit">${esc(c.unitB)}/${esc(c.unitA)}</span></div></label>
       <p class="help">예: 1 ${esc(c.unitA)} = 10 ${esc(c.unitB)} 이면 10 입력. 나눗셈 식(1000/80)도 가능해요.</p>`;
  openSheet({
    title: isBlend ? '새 원료 등록' : '새 품목 등록', html,
    actions: [
      { label: '취소' },
      {

          const nameEl = el.querySelector('#qa-name'), valEl = el.querySelector('#qa-val');
          const name = nameEl.value.trim();
          const v = evalInput(valEl.value);
          nameEl.classList.toggle('invalid', !name);
          valEl.closest('.input-wrap').classList.toggle('invalid', !v.ok);
          if (!name) { nameEl.focus(); return false; }
          if (!v.ok) { valEl.focus(); return false; }
          const item = { id: uid(), name, [isBlend ? 'value' : 'factor']: v.value };
          (isBlend ? c.materials : c.items).push(item);
          c.updatedAt = Date.now();
          onAdded(item);

    ],
  });
}

function toDraft(c) {
  const d = clone(c);
  (d.items || []).forEach((x) => { x.factor = String(x.factor ?? ''); });
  (d.materials || []).forEach((x) => { x.value = String(x.value ?? ''); });
  return d;
}
function blankDraft(type) {
  const base = { id: uid(), type, name: '', desc: '', decimals: 2 };
  if (type === 'convert') return { ...base, labelA: '길이', unitA: 'm', labelB: '무게', unitB: 'g', items: [{ id: uid(), name: '', factor: '' }] };
  if (type === 'formula') return {
    ...base,
    inputs: [{ id: uid(), key: 'A', label: '', unit: '' }, { id: uid(), key: 'B', label: '', unit: '' }],
    outputs: [{ id: uid(), key: 'R1', label: '결과', unit: '', formula: '' }],
  };
  return { ...base, propName: '고형분', amountUnit: 'kg', materials: [{ id: uid(), name: '', value: '' }] };
}
function nextKey(d, prefix) {
  const used = new Set([...d.inputs, ...d.outputs].map((x) => x.key));
  if (prefix === 'in') {
    for (const ch of 'ABCDEFGHIJKLMNOPQSTUVWXYZ') if (!used.has(ch)) return ch;
    let i = 1; while (used.has('X' + i)) i++; return 'X' + i;
  }
  let i = 1; while (used.has('R' + i)) i++; return 'R' + i;
}

function getPath(obj, path) { return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj); }
function setPath(obj, path, val) {
  const ks = path.split('.');
  const last = ks.pop();
  const t = ks.reduce((o, k) => o[k], obj);
  t[last] = val;
}

    </section>`;
}

/** 수식형: 각 계산식 아래 변수 칩과 검증 메시지 갱신 */
function refreshFormulaMsgs() {
  const d = editor.draft;
  const sample = Object.create(null);
  d.inputs.forEach((x) => { sample[x.key] = 1; });
  d.outputs.forEach((o, i) => {
    const known = [...d.inputs.map((x) => x.key), ...d.outputs.slice(0, i).map((x) => x.key)].filter((k) => ID_RE.test(k));
    const varsEl = $app.querySelector(`[data-vars="${i}"]`);
    if (varsEl) {
      varsEl.innerHTML = known.map((k) => `<button type="button" class="var-chip" data-act="ins" data-i="${i}" data-text="${esc(k)}">${esc(k)}</button>`).join('')
        + ['+', '−', '×', '÷', '(', ')'].map((op) => `<button type="button" class="var-chip op" data-act="ins" data-i="${i}" data-text="${{ '−': '-', '×': '*', '÷': '/' }[op] || op}" aria-label="${op}">${op}</button>`).join('');
    }
    const msgEl = $app.querySelector(`[data-fmsg="${i}"]`);
    if (!msgEl) return;
    const r = checkFormula(o.formula, known);
    msgEl.className = 'fmsg full ' + (r.ok ? 'ok' : o.formula.trim() ? 'err' : '');
    msgEl.textContent = r.ok ? '✓ 올바른 식' : (o.formula.trim() ? r.error : '변수 버튼을 눌러 식을 만들 수 있어요');
  });
}
function checkFormula(formula, known) {
  if (!String(formula).trim()) return { ok: false, error: '계산식을 입력하세요' };
  const c = compile(formula);
  if (!c.ok) return { ok: false, error: c.error };
  const unknown = [...c.vars].filter((v) => !known.includes(v) && !(v in CONST));
  if (unknown.length) return { ok: false, error: `'${unknown.join(', ')}' 는 없는 키예요` };
  return { ok: true };
}

function validateDraft(d) {
  const fail = (error, focus) => ({ ok: false, error, focus });
  const out = clone(d);
  out.name = out.name.trim();
  out.desc = (out.desc || '').trim();
  if (!out.name) return fail('계산기 이름을 입력하세요', 'name');
  if (d.type === 'convert') {
    out.unitA = out.unitA.trim(); out.unitB = out.unitB.trim();
    out.labelA = out.labelA.trim() || '입력'; out.labelB = out.labelB.trim() || '환산';
    if (!out.unitA) return fail('입력 단위를 입력하세요', 'unitA');
    if (!out.unitB) return fail('환산 단위를 입력하세요', 'unitB');
    const items = [];
    for (let i = 0; i < d.items.length; i++) {
      const it = d.items[i];
      const name = it.name.trim();
      if (!name && !String(it.factor).trim()) continue;
      if (!name) return fail(`${i + 1}번째 품목 이름을 입력하세요`, `items.${i}.name`);
      const v = evalInput(it.factor);
      if (!v.ok) return fail(`“${name}” 기준값을 숫자로 입력하세요`, `items.${i}.factor`);
      items.push({ id: it.id, name, factor: v.value });
    }
    out.items = items;
  } else if (d.type === 'blend') {
    out.propName = out.propName.trim() || '함량';
    out.amountUnit = out.amountUnit.trim();
    const mats = [];
    for (let i = 0; i < d.materials.length; i++) {
      const m = d.materials[i];
      const name = m.name.trim();
      if (!name && !String(m.value).trim()) continue;
      if (!name) return fail(`${i + 1}번째 원료 이름을 입력하세요`, `materials.${i}.name`);
      const v = evalInput(m.value);
      if (!v.ok) return fail(`“${name}” 함량을 숫자로 입력하세요`, `materials.${i}.value`);
      mats.push({ id: m.id, name, value: v.value });
    }
    out.materials = mats;
  } else {
    if (!d.inputs.length) return fail('입력 항목을 하나 이상 추가하세요');
    if (!d.outputs.length) return fail('결과 항목을 하나 이상 추가하세요');
    const seen = new Set();
    const all = [...d.inputs.map((x, i) => ['inputs', x, i]), ...d.outputs.map((x, i) => ['outputs', x, i])];
    for (const [list, x, i] of all) {
      const k = x.key.trim();
      if (!ID_RE.test(k)) return fail(`키 '${k || '(빈칸)'}' 는 쓸 수 없어요. 영문/한글로 시작하세요`, `${list}.${i}.key`);
      if (FN[k] || k in CONST) return fail(`'${k}' 는 함수 이름이라 키로 쓸 수 없어요`, `${list}.${i}.key`);
      if (seen.has(k)) return fail(`키 '${k}' 가 중복돼요`, `${list}.${i}.key`);
      seen.add(k);
    }
    out.inputs = d.inputs.map((x) => ({ id: x.id, key: x.key.trim(), label: x.label.trim() || x.key.trim(), unit: x.unit.trim() }));
    for (let i = 0; i < d.outputs.length; i++) {
      const o = d.outputs[i];
      const known = [...out.inputs.map((x) => x.key), ...d.outputs.slice(0, i).map((x) => x.key.trim())];
      const r = checkFormula(o.formula, known);
      if (!r.ok) return fail(`“${o.label || o.key}” 계산식: ${r.error}`, `outputs.${i}.formula`);
    }
    out.outputs = d.outputs.map((o) => ({ id: o.id, key: o.key.trim(), label: o.label.trim() || o.key.trim(), unit: o.unit.trim(), formula: o.formula.trim() }));
  }
  return { ok: true, calc: out };
}

function saveEditor() {
  $app.querySelectorAll('.invalid').forEach((e) => e.classList.remove('invalid'));
  const res = validateDraft(editor.draft);
  if (!res.ok) {
    toast(res.error, true);
    const el = res.focus && $app.querySelector(`[data-bind="${res.focus}"]`);
    if (el) {
      (el.closest('.input-wrap') || el).classList.add('invalid');
      el.focus();
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
    return;
  }
  const calc = res.calc;
  calc.updatedAt = Date.now();
  const prev = getCalc(calc.id);
  if (prev) {
    // 새로 추가된 품목이 있으면 계산기로 돌아갔을 때 바로 선택
    if (calc.type === 'convert') {
      const added = calc.items.filter((x) => !prev.items.some((p) => p.id === x.id));
      if (added.length) { const s = db.session[calc.id] || (db.session[calc.id] = {}); s.itemId = added[added.length - 1].id; }
    }
    db.calcs[db.calcs.indexOf(prev)] = calc;
  } else {
    calc.createdAt = Date.now();
    db.calcs.push(calc);
  }
  if (calc.type === 'blend' && db.session[calc.id]?.rows) {
    db.session[calc.id].rows.forEach((r) => { if (r.mat !== 'custom' && !calc.materials.some((m) => m.id === r.mat)) r.mat = calc.materials[0]?.id || 'custom'; });
  }
  persist();
  const wasNew = editor.isNew;
  editor = null;
  toast('저장했어요');
  if (wasNew) replaceRoute('#/calc/' + calc.id);
  else up('#/calc/' + calc.id);
}

async function leaveEditor() {
  if (editor?.dirty) {
    const ok = await confirmDialog({ title: '저장하지 않고 나갈까요?', message: '변경한 내용이 사라져요.', ok: '나가기', danger: true });
    if (!ok) return;
  }
  const d = editor.draft;
  const isNew = editor.isNew;
  editor = null;
  if (isNew) up('#/');
  else up('#/calc/' + d.id);
}

function openPaste(list) {
  const isItems = list === 'items';
  const d = editor.draft;
  openSheet({
    title: '엑셀에서 붙여넣기',
    html: `<p>엑셀에서 <b>이름</b>과 <b>${isItems ? '기준값' : '함량(%)'}</b> 두 열을 복사해 붙여넣으세요. 한 줄에 하나씩, 탭·쉼표로 구분돼도 됩니다.</p>
      <textarea class="txt" id="pasteBox" placeholder="${isItems ? '원단 C\t11.2\n원단 D\t9.8' : '바인더 Y\t42\n증점제\t5'}"></textarea>
      <p class="help" id="pasteInfo">0개 인식</p>`,
    onMount: (el) => {
      const box = el.querySelector('#pasteBox');
      box.addEventListener('input', () => { el.querySelector('#pasteInfo').textContent = `${parsePaste(box.value).length}개 인식`; });
    },
    actions: [
      { label: '취소' },
      {
        label: '추가', kind: 'primary', onClick: (el) => {
          const rows = parsePaste(el.querySelector('#pasteBox').value);
          if (!rows.length) { toast('인식된 줄이 없어요', true); return false; }
          const key = isItems ? 'factor' : 'value';
          const arr = d[list].filter((x) => x.name.trim() || String(x[key]).trim());
          rows.forEach(([name, v]) => {
            const ex = arr.find((x) => x.name.trim() === name);
            if (ex) ex[key] = v; else arr.push({ id: uid(), name, [key]: v });
          });
          d[list] = arr;
          editor.dirty = true;
          renderEditor();
          toast(`${rows.length}개를 반영했어요 (저장을 눌러야 적용돼요)`);
        },
      },
    ],
  });
}
function parsePaste(text) {
  return String(text).split(/\r?\n/).map((line) => {
    const t = line.trim();
    if (!t) return null;
    const m = /^(.*?)[\t,;]+\s*([-+]?[\d.,]+)\s*%?\s*$/.exec(t) || /^(.*\S)\s+([-+]?[\d.,]+)\s*%?\s*$/.exec(t);
    if (!m) return null;
    const name = m[1].trim().replace(/^"|"$/g, '');
    const v = evalInput(m[2]);
    return name && v.ok ? [name, String(v.value)] : null;
  }).filter(Boolean);
}

function insertAtCursor(input, text) {
  const s = input.selectionStart ?? input.value.length, e = input.selectionEnd ?? s;
  const before = input.value.slice(0, s), after = input.value.slice(e);
  const pad = /^[A-Za-z0-9_가-힣]/.test(text) && /[A-Za-z0-9_가-힣)]$/.test(before) ? ' ' : '';
  const ins = (/[+\-*/]/.test(text) && text.length === 1) ? ` ${text} ` : pad + text;
  input.value = (before + ins + after).replace(/ {2,}/g, ' ');
  const caret = Math.min(input.value.length, (before + ins).replace(/ {2,}/g, ' ').length);
  input.focus();
  input.setSelectionRange(caret, caret);
  input.dispatchEvent(new Event('input', { bubbles: true }));
}

/* =========================================================
   이벤트 (위임)
   ========================================================= */
$app.addEventListener('pointerdown', (e) => {
  // 키패드를 눌러도 입력칸 포커스가 유지되도록
  if (e.target.closest('.key, .var-chip')) e.preventDefault();
});

$app.addEventListener('click', (e) => {
  const keyBtn = e.target.closest('[data-key]');
  const r = parseRoute();
  if (keyBtn && r.name === 'calc') { const c = getCalc(r.id); if (c) keypadPress(c, keyBtn.dataset.key); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (b.tagName === 'SELECT' || b.tagName === 'INPUT') return;

  // ---- 메인 ----
  if (act === 'open') return go('#/calc/' + b.dataset.id);
  if (act === 'card-menu') return cardMenu(b.dataset.id);
  if (act === 'new') return openTypePicker();
  if (act === 'home-menu') return homeMenu();

  // ---- 계산기 ----
  if (r.name === 'calc') {
    const c = getCalc(r.id);
    if (!c) return;
    const s = session(c);
    if (act === 'up-home') return up('#/');
    if (act === 'edit-calc') return go('#/edit/' + c.id);
    if (act === 'toggle-keypad') { db.prefs.keypad = !keypadOn(); persist(); return renderCalc(c); }
    if (act === 'copy') return copyText(b.dataset.val);
    if (act === 'clear-all') return clearAll(c);
    if (act === 'pick-item') {
      s.itemId = b.dataset.id;
      $app.querySelectorAll('[data-act="pick-item"]').forEach((x) => x.setAttribute('aria-checked', String(x === b)));
      updateCalc(c); persistSoon();
      if (!isTouch()) getActiveInput()?.focus({ preventScroll: true });
      return;
    }
    if (act === 'quick-add') {
      return quickAddItem(c, (item) => {
        if (c.type === 'convert') s.itemId = item.id;
        renderCalc(c);
      });
    }
    if (act === 'row-add') {
      const row = newBlendRow(c);
      s.rows.push(row); persist();
      calcUI.activeId = 'bl-a-' + row.id;
      renderCalc(c);
      document.getElementById(calcUI.activeId)?.focus();
      return;
    }
    if (act === 'row-del') {
      s.rows = s.rows.filter((x) => x.id !== b.dataset.row);
      if (!s.rows.length) s.rows.push(newBlendRow(c));
      persist();
      return renderCalc(c);
    }
    return;
  }

  // ---- 편집 ----
  if (editor) {
    const d = editor.draft;
    if (act === 'ed-save') return saveEditor();
    if (act === 'ed-cancel') return leaveEditor();
    if (act === 'ed-del') { const c = getCalc(d.id); if (c) deleteCalc(c, () => { editor = null; replaceRoute('#/'); }); return; }
    if (act === 'ed-dup') {
      const c = getCalc(d.id);
      if (!c) return;
      const go2 = async () => {
        if (editor.dirty && !(await confirmDialog({ title: '복제', message: '저장하지 않은 변경 내용은 복제본에 포함되지 않아요. 계속할까요?', ok: '복제' }))) return;
        const copy = duplicateCalc(c);
        editor = null;
        replaceRoute('#/edit/' + copy.id);
      };
      return go2();
    }
    if (act === 'dec') {
      d.decimals = clamp((d.decimals ?? 2) + +b.dataset.d, 0, 8);
      editor.dirty = true;
      $app.querySelector('#decOut').textContent = d.decimals;
      $app.querySelector('#decPreview').textContent = fmt(1234.56789, d.decimals);
      return;
    }
    if (act === 'paste') return openPaste(b.dataset.list);
    if (act === 'ins') {
      const input = $app.querySelector(`[data-bind="outputs.${b.dataset.i}.formula"]`);
      if (input) insertAtCursor(input, b.dataset.text);
      return;
    }
    const list = b.dataset.list;
    if (list && d[list]) {
      const arr = d[list];
      const i = +b.dataset.i;
      if (act === 'row-add') {
        let row;
        if (list === 'items') row = { id: uid(), name: '', factor: '' };
        else if (list === 'materials') row = { id: uid(), name: '', value: '' };
        else if (list === 'inputs') row = { id: uid(), key: nextKey(d, 'in'), label: '', unit: '' };
        else row = { id: uid(), key: nextKey(d, 'out'), label: '', unit: '', formula: '' };
        arr.push(row);
        editor.focusNew = `${list}.${arr.length - 1}.${list === 'inputs' || list === 'outputs' ? 'label' : 'name'}`;
      } else if (act === 'row-del') arr.splice(i, 1);
      else if (act === 'row-up' && i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
      else if (act === 'row-down' && i < arr.length - 1) [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
      else return;
      editor.dirty = true;
      const y = window.scrollY;
      renderEditor();
      if (!editor.focusNew) window.scrollTo(0, y);
    }
  }
});

$app.addEventListener('input', (e) => {
  const el = e.target;
  const r = parseRoute();
  if (r.name === 'calc' && el.matches('input[data-calc]')) {
    const c = getCalc(r.id);
    if (c) { setActive(el); onCalcInput(c, el); }
    return;
  }
  if (r.name === 'calc' && el.dataset.act === 'item-search') {
    const q = el.value.trim().toLowerCase();
    $app.querySelectorAll('[data-act="pick-item"]').forEach((chip) => { chip.hidden = !!q && !chip.dataset.name.includes(q); });
    return;
  }
  if (editor && el.dataset.bind) {
    setPath(editor.draft, el.dataset.bind, el.value);
    editor.dirty = true;
    el.classList.remove('invalid');
    el.closest('.input-wrap')?.classList.remove('invalid');
    const d = editor.draft;
    if (el.hasAttribute('data-unit')) {
      $app.querySelectorAll('[data-unit-hint="row"]').forEach((x) => { x.textContent = `${d.unitB}/${d.unitA}`; });
      const head = $app.querySelector('[data-unit-hint="head"]');
      if (head) head.textContent = d.type === 'convert' ? `1 ${d.unitA} 당 ${d.unitB}` : `${d.propName} 함량 %`;
    }
    if (d.type === 'formula' && (el.hasAttribute('data-formula') || el.hasAttribute('data-key-field'))) refreshFormulaMsgs();
  }
});

$app.addEventListener('change', (e) => {
  const el = e.target;
  const r = parseRoute();
  if (r.name !== 'calc') return;
  const c = getCalc(r.id);
  if (!c) return;
  if (el.matches('input[data-calc]')) return commitExpr(c, el);
  if (el.dataset.act === 'row-mat') {
    const s = session(c);
    const row = s.rows.find((x) => x.id === el.dataset.row);
    if (!row) return;
    if (el.value === '__new') {
      el.value = row.mat;
      return quickAddItem(c, (m) => { row.mat = m.id; renderCalc(c); });
    }
    row.mat = el.value;
    persist();
    calcUI.activeId = row.mat === 'custom' ? 'bl-c-' + row.id : 'bl-a-' + row.id;
    renderCalc(c);
    if (!isTouch()) document.getElementById(calcUI.activeId)?.focus();
  }
});

$app.addEventListener('focusin', (e) => {
  if (e.target.matches('input[data-calc]') && calcUI) setActive(e.target);
});

$app.addEventListener('keydown', (e) => {
  const el = e.target;
  const r = parseRoute();
  if (r.name === 'calc' && el.matches('input[data-calc]') && e.key === 'Enter') {
    e.preventDefault();
    const c = getCalc(r.id);
    if (!c) return;
    commitExpr(c, el);
    const nx = nextCalcInput(el);
    if (nx) { nx.focus(); nx.select(); }
  }
  if (editor && e.key === 'Enter' && el.matches('.erow input')) {
    e.preventDefault();
    const inputs = [...$app.querySelectorAll('#edForm input')];
    inputs[inputs.indexOf(el) + 1]?.focus();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && sheet) { e.preventDefault(); return closeSheet(); }
  if (sheet) return;
  if ((e.ctrlKey || e.metaKey) && e.key === 's' && editor) { e.preventDefault(); return saveEditor(); }
  // 계산기 화면에서 입력칸 밖에 있을 때 숫자 키를 누르면 활성 입력칸으로
  const r = parseRoute();
  if (r.name !== 'calc' || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t.matches('input, textarea, select')) return;
  if (/^[0-9.+\-*/]$/.test(e.key)) {
    const el = getActiveInput();
    if (!el) return;
    e.preventDefault();
    el.focus();
    const c = getCalc(r.id);
    if (c) keypadPress(c, e.key);
  }
});

window.matchMedia('(pointer: coarse)').addEventListener?.('change', applyInputMode);

/* =========================================================
   시작
   ========================================================= */
try { if (!localStorage.getItem(STORE_KEY)) persist(); } catch { storageOk = false; }
render();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
