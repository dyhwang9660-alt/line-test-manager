      updateCalc(c); persistSoon();
      if (!isTouch()) getActiveInput()?.focus({ preventScroll: true });
      return;
    }
    if (act === 'quick-add') {
      return quickAddItem(c, (item) => {
        if (c.type === 'convert') s.itemId = item.id;
        renderCalc(c);
      });
    }
    if (act === 'row-add') {
      const row = newBlendRow(c);
      s.rows.push(row); persist();
      calcUI.activeId = 'bl-a-' + row.id;
      renderCalc(c);
      document.getElementById(calcUI.activeId)?.focus();
      return;
    }
    if (act === 'row-del') {
      s.rows = s.rows.filter((x) => x.id !== b.dataset.row);
      if (!s.rows.length) s.rows.push(newBlendRow(c));
      persist();
      return renderCalc(c);

  // ---- 편집 ----
  if (editor) {
    const d = editor.draft;
    const rerender = () => { editor.dirty = true; const focusing = !!editor.focusNew; const y = window.scrollY; renderEditor(); if (!focusing) window.scrollTo(0, y); };
    // 지운 뒤 5초 동안 되돌리기 (지우기 직전 초안으로 돌아감)
    const offerUndo = (snap, msg) => {
      const key = editor.key;
      toast(msg, false, { label: '되돌리기', onClick: () => { if (!editor || editor.key !== key) return; editor.draft = snap; rerender(); } });
    };
    const usedIn = (keys) => d.outputs.filter((o) => { const c = compile(o.formula); return c.ok && keys.some((k) => c.vars.has(k)); }).map((o) => o.label || o.key);
    const delMsg = (keys) => { const used = usedIn(keys); return used.length ? `줄 삭제 · ${keys.join(', ')} 키를 쓰는 계산식(${used.join(', ')}) 수정 필요` : '줄 삭제'; };
    if (act === 'ed-save') return saveEditor();
    if (act === 'ed-cancel') return leaveEditor();
    if (act === 'ed-del') { const c = getCalc(d.id); if (c) deleteCalc(c, () => { dropEditor(); leaveDeleted(c.id); }); return; }
    if (act === 'ed-dup') {
      const c = getCalc(d.id);
      if (!c) return;
      const go2 = async () => {
        if (editor.dirty && !(await confirmDialog({ title: '복제', message: '저장하지 않은 변경 내용은 원본에도 복제본에도 반영되지 않고 사라집니다. 원본은 마지막으로 저장한 상태로 복제됩니다.', ok: '복제' }))) return;
        const copy = duplicateCalc(c);
        dropEditor();
        openCopyEditor(c.id, copy.id);
      };
      return go2();
    }
    if (act === 'dec') {
      const nd = clamp((d.decimals ?? 2) + +b.dataset.d, 0, 8);
      if (nd === d.decimals) return;   // 끝값(0·8)에서는 바뀐 것이 없음
      d.decimals = nd;
      editor.dirty = true;
      $app.querySelector('#decOut').textContent = nd;
      $app.querySelector('#decPreview').textContent = fmt(DEC_SAMPLE, nd);
      $app.querySelectorAll('[data-act="dec"]').forEach((x) => { x.disabled = +x.dataset.d < 0 ? nd <= 0 : nd >= 8; });
      refreshTest();
      saveDraftSoon();
      return;
    }
    if (act === 'paste') return openPaste(b.dataset.list, +b.dataset.i);
    if (act === 'pick-group') {
      d.group = d.group === b.dataset.g ? '' : b.dataset.g;
      editor.dirty = true;
      $app.querySelector('#edGroup').value = d.group;
      $app.querySelectorAll('[data-act="pick-group"]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.g === d.group)));
      saveDraftSoon();
      return;
    }
    if (act === 'ins') {
      const input = $app.querySelector(`[data-bind="outputs.${b.dataset.i}.formula"]`);
      if (input) insertAtCursor(input, b.dataset.text);
      return;
    }
    // ---- 수식형 표 입력 ----
    if (act === 'in-kind') {
      const x = d.inputs[+b.dataset.i];
      const table = b.dataset.kind === 'table';
      if ((x.kind === 'table') === table) return;
      if (table) {
        x.kind = 'table';
        // 첫 열은 원래 키를 이어 써서 그 키를 쓰던 계산식이 그대로 동작
        if (!x.cols?.length) x.cols = [{ id: uid(), key: String(x.key).trim() || nextKey(d, 'in'), label: x.label || '', unit: x.unit || '' }];
        if (!x.rows) x.rows = [{ id: uid(), name: '', vals: x.cols.map(() => '') }];
      } else {
        delete x.kind;
        const k = String(x.key).trim();
        if (!ID_RE.test(k) || inputKeys(d.inputs.filter((y) => y !== x)).includes(k)) x.key = nextKey(d, 'in');
        x.unit ??= '';
      }
      return rerender();
    }
    if (act === 'tcol-add') {
      const x = d.inputs[+b.dataset.i];
      x.cols.push({ id: uid(), key: nextKey(d, 'in'), label: '', unit: '' });
      x.rows.forEach((r) => r.vals.push(''));
      editor.focusNew = `inputs.${b.dataset.i}.cols.${x.cols.length - 1}.label`;
      return rerender();
    }
    if (act === 'tcol-del') {
      const x = d.inputs[+b.dataset.i];
      const j = +b.dataset.j;
      if (x.cols.length <= 1) return;
      const snap = clone(d);
      const [gone] = x.cols.splice(j, 1);
      x.rows.forEach((r) => r.vals.splice(j, 1));
      rerender();
      return offerUndo(snap, delMsg([String(gone.key).trim()]).replace('줄 삭제', '열 삭제'));
    }
    if (act === 'trow-add') {
      const x = d.inputs[+b.dataset.i];
      x.rows.push({ id: uid(), name: '', vals: x.cols.map(() => '') });
      editor.focusNew = `inputs.${b.dataset.i}.rows.${x.rows.length - 1}.name`;
      return rerender();
    }
    if (act === 'trow-del') {
      const snap = clone(d);
      d.inputs[+b.dataset.i].rows.splice(+b.dataset.k, 1);
      rerender();
      return offerUndo(snap, '항목 삭제');
    }
    const list = b.dataset.list;
    if (list && d[list]) {
      const arr = d[list];
      const i = +b.dataset.i;
      let snap = null, focusTo = null, msg = '';
      if (act === 'row-add') {
        let row;
        if (list === 'items') row = { id: uid(), name: '', factor: '' };
        else if (list === 'materials') row = { id: uid(), name: '', value: '' };
        else if (list === 'inputs') row = { id: uid(), key: nextKey(d, 'in'), label: '', unit: '' };
        else row = { id: uid(), key: nextKey(d, 'out'), label: '', unit: '', formula: '' };
        arr.push(row);
        editor.focusNew = `${list}.${arr.length - 1}.${list === 'inputs' || list === 'outputs' ? 'label' : 'name'}`;
      } else if (act === 'row-del') {
        snap = clone(d);
        const [gone] = arr.splice(i, 1);
        msg = list === 'inputs' ? delMsg(gone.kind === 'table' ? gone.cols.map((col) => String(col.key).trim()) : [String(gone.key).trim()])
          : list === 'outputs' ? delMsg([String(gone.key).trim()]) : '줄 삭제';
        focusTo = ['row-del', Math.min(i, arr.length - 1)];
      } else if (act === 'row-up' && i > 0) { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; focusTo = ['row-up', i - 1]; }
      else if (act === 'row-down' && i < arr.length - 1) { [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; focusTo = ['row-down', i + 1]; }
      else return;
      rerender();
      // 옮기거나 지운 뒤에도 같은 줄의 버튼에 포커스를 둬서 키보드 사용자가 자리를 잃지 않게
      if (focusTo) focusRowTool(list, ...focusTo);
      if (snap) offerUndo(snap, msg);
    }
  }
});
function focusRowTool(list, act, i) {
  const q = (a) => $app.querySelector(`[data-act="${a}"][data-list="${list}"][data-i="${i}"]`);
  const el = [q(act), q('row-up'), q('row-down'), q('row-del')].find((x) => x && !x.disabled) || $app.querySelector(`[data-act="row-add"][data-list="${list}"]`);
  el?.focus({ preventScroll: true });
}

$app.addEventListener('keydown', (e) => {
  const el = e.target;
  const r = parseRoute();
  if (el.classList.contains('combo-input')) {
    const combo = el.closest('.combo');
    const open = !combo.querySelector('.combo-list').hidden;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!open) renderComboList(el);
      else setComboSel(combo, (combo._sel ?? -1) + (e.key === 'ArrowDown' ? 1 : -1));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (open) chooseCombo(combo, combo._sel ?? 0);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      e.stopPropagation();
      closeCombo(combo);
      el.blur();
    }
    return;
  }
  // 한글 조합 중 Enter 는 조합을 끝내는 키이므로 넘김
  if (e.key === 'Enter' && (e.isComposing || e.keyCode === 229)) return;
  if (r.name === 'calc' && el.matches('input[data-calc]') && (e.key === 'Enter' || e.key === '=')) {
    e.preventDefault();
    const c = getCalc(r.id);
    if (!c) return;
    commitExpr(c, el);
    if (e.key === '=') return;
    // 환산형은 다음 칸이 계산된 쪽이라 넘어가면 계산 방향이 뒤집히므로 제자리에서 전체 선택

document.addEventListener('keydown', (e) => {

  const isSave = (e.ctrlKey || e.metaKey) && !e.altKey && (e.code === 'KeyS' || e.key.toLowerCase() === 's');
  if (e.key === 'Escape' && sheet) { e.preventDefault(); return sheet.el._dirty ? toast(SHEET_DIRTY_MSG) : closeSheet(); }
  if (sheet) { if (isSave) e.preventDefault(); return; }   // 창이 열린 채면 브라우저 저장 창도 막음
  const r = parseRoute();
  if (isSave && editor && (r.name === 'edit' || r.name === 'new')) { e.preventDefault(); return saveEditor(); }
  // 계산기 화면에서 입력칸 밖에 있을 때 숫자 키를 누르면 활성 입력칸으로
  if (r.name !== 'calc' || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t.matches('input, textarea, select')) return;
  if (/^[0-9.+\-*/=]$/.test(e.key)) {
    const el = getActiveInput();
    if (!el) return;
    e.preventDefault();

    const c = getCalc(r.id);
    if (c) keypadPress(c, e.key);
  }
});

// 처음부터 저장이 막힌 브라우저도 알 수 있게 시험 저장
try { const k = `${STORE_KEY}.test`; localStorage.setItem(k, '1'); localStorage.removeItem(k); } catch { storageOk = false; }
try { if (storageOk && !localStorage.getItem(STORE_KEY)) persist(); } catch { storageOk = false; }
updateStorageBanner();
render();
if (dbBroken) { persist(); toast('저장 데이터 손상 · 예제 계산기로 시작합니다. 손상된 원본은 따로 보관했습니다.', true); }

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
