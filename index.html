<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>맞춤 계산기</title>
<meta name="description" content="품목별 기준값을 등록해 쓰는 맞춤 계산기">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="맞춤 계산기">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%230b0b0c'/%3E%3Crect x='19' y='15' width='26' height='10' rx='3' fill='%23fff'/%3E%3Ccircle cx='23' cy='34' r='3.6' fill='%238a8a90'/%3E%3Ccircle cx='32' cy='34' r='3.6' fill='%238a8a90'/%3E%3Ccircle cx='23' cy='44' r='3.6' fill='%238a8a90'/%3E%3Ccircle cx='32' cy='44' r='3.6' fill='%238a8a90'/%3E%3Crect x='37.4' y='30.4' width='7.2' height='17.2' rx='3.6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: 흰 바탕 위에 검은 결과 카드 하나를 주인공으로, 나머지는 옅은 회색 면으로 구분 */
:root {
  --bg: #ffffff;
  --surface: #f4f4f5;
  --surface-2: #e9e9eb;
  --field: #ffffff;
  --ink: #0b0b0c;
  --muted: #8a8a90;
  --line: #e4e4e7;
  --hero: #0b0b0c;
  --hero-ink: #ffffff;
  --hero-dim: #9b9ba1;
  --hero-pill: #232326;
  --hero-btn: #f4f4f5;
  --hero-btn-ink: #0b0b0c;
  --k-num: #f4f4f5;
  --k-fn: #e4e4e7;
  --k-op: #0b0b0c;
  --k-op-ink: #ffffff;
  --on-ink: #ffffff;
  --ring: rgba(11, 11, 12, .10);
  --danger: #d4342c;
  --danger-soft: #fdecea;
  --ok: #1f8a4c;
  --overlay: rgba(11, 11, 12, .45);
  --shadow: 0 10px 30px rgba(11, 11, 12, .08);
  --font: "Plus Jakarta Sans", "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0c; --surface: #18181a; --surface-2: #232326; --field: #0b0b0c; --ink: #f4f4f5; --muted: #8a8a90; --line: #2a2a2e;
    --hero: #f4f4f5; --hero-ink: #0b0b0c; --hero-dim: #6b6b71; --hero-pill: #e1e1e4; --hero-btn: #0b0b0c; --hero-btn-ink: #f4f4f5;
    --k-num: #1c1c1f; --k-fn: #2a2a2e; --k-op: #f4f4f5; --k-op-ink: #0b0b0c; --on-ink: #0b0b0c; --ring: rgba(244, 244, 245, .14);
    --danger: #ff6b61; --danger-soft: #3a1d1b; --ok: #5fd08e; --overlay: rgba(0, 0, 0, .65); --shadow: 0 10px 30px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0c; --surface: #18181a; --surface-2: #232326; --field: #0b0b0c; --ink: #f4f4f5; --muted: #8a8a90; --line: #2a2a2e;
  --hero: #f4f4f5; --hero-ink: #0b0b0c; --hero-dim: #6b6b71; --hero-pill: #e1e1e4; --hero-btn: #0b0b0c; --hero-btn-ink: #f4f4f5;
  --k-num: #1c1c1f; --k-fn: #2a2a2e; --k-op: #f4f4f5; --k-op-ink: #0b0b0c; --on-ink: #0b0b0c; --ring: rgba(244, 244, 245, .14);
  --danger: #ff6b61; --danger-soft: #3a1d1b; --ok: #5fd08e; --overlay: rgba(0, 0, 0, .65); --shadow: 0 10px 30px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 15px; line-height: 1.45; letter-spacing: -.005em;
  font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .35; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.shell {
  max-width: 480px; margin: 0 auto;
  padding-block: 12px calc(28px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.shell.wide { max-width: 760px; }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 8px; min-height: 56px; margin-bottom: 10px; }
.topbar h1 { flex: 1; min-width: 0; margin: 0; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand h1 { flex: none; font-size: 18px; }
.brand small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.logo { width: 42px; height: 42px; border-radius: 50%; flex: none; display: block; }
.icon-btn {
  width: 44px; height: 44px; flex: none; display: inline-grid; place-items: center;
  border: 0; border-radius: 50%; background: var(--surface); color: var(--ink);
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn.plain { background: transparent; }
.icon-btn.plain:hover { background: var(--surface); }
.icon-btn[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.icon-btn svg { width: 20px; height: 20px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 48px; padding: 0 20px; border-radius: 999px; border: 0;
  background: var(--surface); color: var(--ink); font-weight: 600; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--ink); color: var(--on-ink); }
.btn.primary:hover { opacity: .88; }
.btn.danger { color: var(--danger); background: var(--danger-soft); }
.btn.danger.solid { background: var(--danger); color: #fff; }
.btn.ghost { background: transparent; }
.btn.ghost:hover { background: var(--surface); }
.btn.sm { height: 40px; padding: 0 16px; font-size: 14px; }
.btn.block { width: 100%; }

/* ---------- home ---------- */
.hero {
  background: var(--hero); color: var(--hero-ink); border-radius: 26px; padding: 20px;
  display: grid; gap: 22px; margin-bottom: 14px;
}
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.hero-label { font-size: 13px; color: var(--hero-dim); font-weight: 500; }
.hero-num { font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.hero-num span { font-size: 16px; font-weight: 600; margin-left: 4px; color: var(--hero-dim); }
.hero-pill {
  height: 40px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--hero-ink); color: var(--hero);
  font-weight: 700; font-size: 14px;
}
.hero-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hero-btn {
  height: 52px; border: 0; border-radius: 999px; background: var(--hero-btn); color: var(--hero-btn-ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14.5px;
}
.hero-btn svg { width: 19px; height: 19px; }
.hero-btn:hover { opacity: .9; }
.searchbar {
  display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 6px 0 18px; margin-bottom: 22px;
  border: 1.5px solid var(--line); border-radius: 999px; background: var(--bg);
}
.searchbar:focus-within { border-color: var(--ink); }
.searchbar > svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.searchbar input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; height: 100%; }
.searchbar input::placeholder { color: var(--muted); }
.searchbar { padding-right: 18px; }
.sec-title { display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px 12px; }
.sec-title h2 { margin: 0; font-size: 16px; font-weight: 700; }
.sec-title span { font-size: 13px; color: var(--muted); }
.home-sub { display: none; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card {
  position: relative; display: flex; flex-direction: column; min-height: 156px; padding: 16px;
  border-radius: 22px; background: var(--surface); text-align: left; color: var(--ink); transition: transform .12s ease;
}
.card:active { transform: scale(.985); }
.card-open { position: absolute; inset: 0; border: 0; background: transparent; border-radius: 22px; }
.card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; pointer-events: none; }
.card-top .icon-btn { pointer-events: auto; position: relative; width: 34px; height: 34px; margin: -4px -4px -4px 0; background: var(--field); }
/* 작은 버튼도 누르는 영역은 44px */
.card-top .icon-btn::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; }
.home-empty { padding: 28px 18px; border-radius: 22px; background: var(--surface); text-align: center; display: grid; gap: 10px; justify-items: center; }
.home-empty h2 { margin: 0; font-size: 16px; }
.home-empty p { margin: 0; color: var(--muted); font-size: 14px; }
.home-empty .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
.home-empty .btn:not(.primary) { background: var(--field); }
.draft-note { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; margin-bottom: 16px; border-radius: 20px; background: var(--surface); border: 1.5px solid var(--ink); }
.draft-note b { display: block; font-size: 14px; }
.draft-note span { font-size: 13px; color: var(--muted); }
.draft-note .row { display: flex; gap: 8px; }
.draft-note .btn:not(.primary) { background: var(--field); }
.card-name { font-size: 16px; font-weight: 700; line-height: 1.3; margin: 0 0 4px; overflow-wrap: anywhere; pointer-events: none; }
.card-meta { margin-top: auto; font-size: 12.5px; color: var(--muted); pointer-events: none; }
.badge {
  display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 11px; border-radius: 999px;
  font-size: 12px; font-weight: 700; background: var(--field); color: var(--ink); white-space: nowrap; flex: none;
}
.badge svg { width: 13px; height: 13px; }
.card.add {
  align-items: center; justify-content: center; gap: 8px; background: transparent;
  border: 1.5px dashed var(--line); color: var(--muted); font-weight: 600;
}
.card.add:hover { border-color: var(--ink); color: var(--ink); }
.card.add svg { width: 26px; height: 26px; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }

/* groups */
.group-tabs {
  display: flex; gap: 8px; overflow-x: auto; margin: 0 0 20px; padding: 2px 0;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.group-tabs::-webkit-scrollbar { display: none; }
.gtab {
  flex: none; height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--surface);
  font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
}
.gtab:hover { background: var(--surface-2); }
.gtab .n { font-size: 12px; font-weight: 700; color: var(--muted); }
.gtab[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.gtab[aria-pressed="true"] .n { color: inherit; opacity: .6; }
.gtab.add { background: transparent; border: 1.5px dashed var(--line); color: var(--muted); }
.gtab.add:hover { border-color: var(--ink); color: var(--ink); }
.gtab svg { width: 16px; height: 16px; }
.group { margin-bottom: 26px; }
.group-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 2px 12px 4px; }
.group-head h2 { margin: 0; font-size: 16px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.group-head h2 span { font-size: 13px; color: var(--muted); font-weight: 600; }
.group-tools { display: flex; gap: 8px; flex: none; }
.icon-btn.sm { width: 36px; height: 36px; position: relative; }
.icon-btn.sm::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; }
.icon-btn.sm svg { width: 18px; height: 18px; }
.group-empty { padding: 22px 16px; border-radius: 22px; border: 1.5px dashed var(--line); color: var(--muted); text-align: center; font-size: 14px; }
.menu button .check { margin-left: auto; color: var(--ink); }
.menu button .check svg { background: none; padding: 0; width: 18px; height: 18px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.chip.sm { height: 34px; padding: 0 14px; font-size: 13px; }
.gchips { margin-top: 8px; }

/* combobox (검색 자동완성) */
.combo { position: relative; }
.combo-field {
  display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px 0 18px; border-radius: 999px;
  background: var(--surface); border: 1.5px solid transparent;
}
.combo-field:focus-within { border-color: var(--ink); background: var(--field); }
.combo-field > svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.combo-input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; font-weight: 600; }
.combo-input::placeholder { color: var(--muted); font-weight: 500; }
.combo.sm .combo-field { height: 46px; border-radius: 14px; padding: 0 10px 0 12px; background: var(--field); gap: 6px; }
.combo-list {
  position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 30; max-height: min(300px, 50vh); overflow: auto;
  margin: 0; padding: 6px; list-style: none; background: var(--bg); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
}
.combo-opt { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 14px; cursor: pointer; }
.combo-opt b { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.combo-opt b mark { background: none; color: inherit; font-weight: 800; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.combo-opt small { color: var(--muted); white-space: nowrap; font-size: 12.5px; }
.combo-opt svg { width: 16px; height: 16px; flex: none; }
.combo-opt[aria-selected="true"], .combo-opt:hover { background: var(--surface); }
.combo-opt.special b { color: var(--muted); }
.combo-empty { padding: 12px; color: var(--muted); font-size: 13.5px; text-align: center; }
.chips-label { align-self: center; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-right: 2px; }
.panel-head h2 .count { font-size: 12.5px; color: var(--muted); font-weight: 600; margin-left: 4px; }
.install-steps { margin: 0; padding-left: 20px; display: grid; gap: 8px; color: var(--ink); }
.url-box { display: flex; gap: 8px; align-items: center; padding: 6px 6px 6px 14px; border-radius: 999px; background: var(--surface); margin-top: 12px; }
.url-box code { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 13px; }

/* ---------- calculator ---------- */
.device { display: block; }
.lcd {
  position: relative; background: var(--hero); color: var(--hero-ink); border-radius: 26px;
  padding: 18px 20px 20px; min-height: 150px; display: flex; flex-direction: column;
}
.lcd-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--hero-dim); padding-right: 40px; min-height: 30px; }
.lcd-top span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lcd-top span:first-child { font-weight: 500; }
.lcd-top span:last-child:not(:first-child):not(:empty) { background: var(--hero-pill); color: var(--hero-ink); padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.lcd-expr { margin-top: auto; min-height: 22px; padding-top: 12px; font-size: 14px; color: var(--hero-dim); overflow-wrap: anywhere; }
.lcd-main { display: flex; align-items: baseline; gap: 8px; line-height: 1.05; }
.lcd-main .num { font-size: clamp(36px, 11vw, 50px); font-weight: 700; letter-spacing: -.03em; overflow-wrap: anywhere; min-width: 0; }
.lcd-main .unit { font-size: 18px; font-weight: 600; color: var(--hero-dim); flex: none; }
.lcd-main.dim .num { color: var(--hero-dim); }
.lcd-main.err .num { font-size: 24px; }
.lcd-rows { margin-top: 16px; display: grid; gap: 6px; font-size: 14px; }
.lcd-row { display: flex; justify-content: space-between; gap: 10px; padding-top: 6px; border-top: 1px solid var(--hero-pill); }
.lcd-row span { color: var(--hero-dim); }
.lcd-row b { font-weight: 600; text-align: right; overflow-wrap: anywhere; margin-left: auto; }
.lcd-row { align-items: center; }
.row-copy {
  position: relative; width: 28px; height: 28px; flex: none; border: 0; border-radius: 50%;
  background: var(--hero-pill); color: var(--hero-ink); display: grid; place-items: center;
}
.row-copy::after { content: ""; position: absolute; inset: -8px; }
.row-copy svg { width: 14px; height: 14px; }
.lcd-reason { margin-top: 8px; font-size: 13px; color: var(--hero-dim); }
.lcd-copy {
  position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border: 0; border-radius: 50%;
  background: var(--hero-pill); color: var(--hero-ink); display: grid; place-items: center;
}
.lcd-copy:hover { opacity: .8; }
.lcd-copy svg { width: 16px; height: 16px; }

.panel { margin-top: 18px; display: grid; gap: 14px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
.link-btn { border: 0; background: none; padding: 4px 2px; font-size: 13px; font-weight: 600; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.link-btn:hover { color: var(--ink); }

.field-label { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 4px 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
.field-label .key-tag { font-size: 11.5px; font-weight: 700; color: var(--muted); background: var(--surface); border-radius: 999px; padding: 1px 8px; }
.input-wrap {
  display: flex; align-items: center; background: var(--surface); border: 1.5px solid transparent;
  border-radius: 18px; height: 58px; padding: 0 18px; transition: border-color .12s, background .12s;
}
.input-wrap:focus-within, .input-wrap.active { border-color: var(--ink); background: var(--field); }
.input-wrap.bad { border-color: var(--danger); }
.input-wrap input {
  flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; outline: none;
  font-size: 22px; font-weight: 700; text-align: right; color: var(--ink); letter-spacing: -.01em;
}
.input-wrap input::placeholder { color: var(--muted); opacity: .5; }
.input-wrap .unit { margin-left: 8px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.input-wrap.sm { height: 46px; border-radius: 14px; padding: 0 12px; }
.input-wrap.sm input { font-size: 17px; }
.input-wrap.sm .unit { font-size: 13px; }

.dir { display: grid; place-items: center; height: 20px; color: var(--muted); }
.dir svg { width: 18px; height: 18px; transition: transform .18s ease; }
.dir.up svg { transform: rotate(180deg); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--surface);
  font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
}
.chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip:hover { background: var(--surface-2); }
.chip[aria-checked="true"] { background: var(--ink); color: var(--on-ink); }
.chip.add { background: transparent; border: 1.5px dashed var(--line); color: var(--muted); }
.chip.add:hover { color: var(--ink); border-color: var(--ink); }
.chip svg { width: 16px; height: 16px; }
.search {
  width: 100%; height: 46px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--bg);
  padding: 0 18px; outline: none;
}
.search:focus { border-color: var(--ink); }
.notice { padding: 20px; border-radius: 22px; background: var(--surface); color: var(--muted); text-align: center; display: grid; gap: 12px; justify-items: center; }

/* blend rows */

  const run = (a) => { const r = a.onClick ? a.onClick(wrap) : undefined; if (r !== false) closeSheet(); };
  wrap.addEventListener('click', (e) => {
    if (e.target.closest('[data-close]')) return closeSheet();
    // 입력 중인 창은 바깥을 눌러도 닫지 않음 (실수로 입력 내용을 잃지 않도록)
    if (e.target === wrap) return wrap._dirty ? toast(SHEET_DIRTY_MSG) : closeSheet();
    const b = e.target.closest('[data-ai]');
    if (b) run(actions[+b.dataset.ai]);
  });
  wrap.addEventListener('input', () => { wrap._dirty = true; });
  wrap.addEventListener('keydown', (e) => {
    // Tab 키로 창 뒤 화면까지 가지 않도록 창 안에서만 돌게 함
    if (e.key === 'Tab') {
      const f = [...wrap.querySelectorAll('button, input, textarea, select')].filter((x) => !x.disabled && x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      return;
    }
    if (e.key === 'Enter' && e.target.matches('input') && !e.isComposing && e.keyCode !== 229) {
      const primary = actions.find((a) => (a.kind || '').includes('primary'));
      if (primary) { e.preventDefault(); run(primary); }
    }
  });
  document.body.appendChild(wrap);
  sheet = { el: wrap, lastFocus };
  $app.inert = true;   // 창 뒤 화면은 누르거나 포커스되지 않게
  pushSheetEntry();
  onMount?.(wrap);
  // 처음 포커스: 입력칸 → 주 버튼(기존에 추가 등) → 첫 버튼. 위험 버튼에는 처음 포커스를 두지 않음
  if (!wrap.contains(document.activeElement)) (wrap.querySelector('input, textarea, select') || wrap.querySelector('.btn.primary[data-ai]') || wrap.querySelector('[data-ai]:not(.danger), .menu button') || wrap.querySelector('[data-close]'))?.focus();
  return wrap;
}
function closeSheet(restore = true) {
  if (!sheet) return;
  const { el, lastFocus } = sheet;
  sheet = null;
  el.remove();
  $app.inert = false;
  if (restore && lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  // 바로 다른 창이 열리면 그 창이 기록 칸을 이어 씀. 아니면 창용 칸을 지워 뒤로가기 헛누름을 막음
  queueMicrotask(() => { if (!sheet) dropSheetEntry(); });
}
function confirmDialog({ title, message, ok = '확인', danger = false }) {
  return new Promise((resolve) => {
    let done = false;
    const finish = (v) => { if (!done) { done = true; resolve(v); } };
    const el = openSheet({
      title, html: `<p>${esc(message)}</p>`,
      actions: [
        { label: '취소', onClick: () => finish(false) },
        { label: ok, kind: danger ? 'danger solid' : 'primary', onClick: () => finish(true) },
      ],
    });
    new MutationObserver((_, obs) => { if (!document.contains(el)) { obs.disconnect(); finish(false); } }).observe(document.body, { childList: true });
  });
}
function menuSheet(title, items) {
  const html = `<div class="menu">${items.map((it, i) => it === '-' ? '<hr>' : `<button data-mi="${i}" class="${it.danger ? 'danger' : ''}">${it.icon || ''}<span>${esc(it.label)}</span></button>`).join('')}</div>`;
  openSheet({
    title, html,
    onMount: (el) => el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-mi]');
      if (!b) return;
      closeSheet(false);
      items[+b.dataset.mi].onClick();
    }),
  });
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch { /* 무시 */ }
    ta.remove();
  }
  toast(`복사 완료: ${text}`);
}

/** 편집을 끝내거나 버릴 때: 보관해 둔 초안도 지움 */
function dropEditor() { editor = null; if (db.draft) { delete db.draft; persistSoon(); } }
/** 고친 내용이 있으면 초안을 저장 공간에 보관 (창 닫기·새로고침·휴대폰의 앱 재로드 대비) */
function saveDraftSoon() {
  if (!editor?.dirty) return;
  db.draft = { key: editor.key, draft: editor.draft, isNew: editor.isNew, from: editor.from, at: Date.now() };
  persistSoon();
}
window.addEventListener('beforeunload', (e) => {
  if (!editor?.dirty) return;
  saveDraftSoon(); persist();
  e.preventDefault(); e.returnValue = '';   // PC 브라우저는 "사이트에서 나가시겠습니까?"를 띄움
});
let homeScroll = 0;  // 홈을 떠날 때의 스크롤 위치 (돌아오면 그 자리로)
let homeQuery = '';  // 홈 검색어 (돌아와도 유지)

function render() {
  closeSheet(false);
  const r = parseRoute();
  const viewKey = location.hash;
  const changed = viewKey !== currentView;
  if (changed && parseRoute(currentView).name === 'home' && $app.querySelector('#homeBody')) homeScroll = window.scrollY;
  currentView = viewKey;
  if (r.name !== 'edit' && r.name !== 'new' && editor) dropEditor();   // 편집 화면이 아니면 남은 초안을 버림
  if (r.name === 'calc') {
    const c = getCalc(r.id);
    if (!c) return leaveInvalid();
    if (!calcUI || calcUI.id !== c.id) calcUI = { id: c.id, activeId: null };
    renderCalc(c, changed);
  } else if (r.name === 'edit' || r.name === 'new') {
    if (!editor || editor.key !== viewKey) {
      // 들어온 화면을 기억해 ←·저장 뒤 그 화면으로 돌아감
      const from = navStack.length >= 2 ? navStack[navStack.length - 2] : null;
      if (r.name === 'edit') {
        const c = getCalc(r.id);
        if (!c) return leaveInvalid();
        editor = { key: viewKey, draft: toDraft(c), isNew: false, dirty: false, from, test: {} };
      } else {
        if (!TYPES[r.type]) return leaveInvalid();
        editor = { key: viewKey, draft: blankDraft(r.type, pendingGroup), isNew: true, dirty: false, from, test: {} };
        pendingGroup = '';
      }
      // 저장하지 않고 닫았던 같은 화면의 초안이 있으면 이어서
      const saved = db.draft?.key === viewKey ? db.draft : null;
      if (saved) {
        editor.draft = saved.draft;
        editor.dirty = true;
        editor.from = from ?? saved.from ?? null;
        toast('저장하지 않은 편집 내용을 불러왔습니다');
      }
    }
    renderEditor();
  } else {
    renderHome();
  }
  if (changed) window.scrollTo(0, r.name === 'home' ? homeScroll : 0);
}

function newGroupSheet(after) {

    title: '새 묶음', label: '묶음 이름', placeholder: '예: 원단, 코팅액, 배합', ok: '만들기',
    onOk: (name) => {
      const err = groupNameError(name);
      if (err) return err;
      db.groups.push(name);
      persist();
      // 만든 뒤 바로 옮기는 경우는 옮긴 쪽 알림이 두 가지를 함께 알림
      if (after) return void after(name);
      db.prefs.groupFilter = name; persist(); renderHome();
      toast(`“${name}” 묶음 생성 완료`);
    },
  });
}
function groupMenu(g) {
  const idx = db.groups.indexOf(g);
  if (idx < 0) return;
  const move = (d) => {
    const j = idx + d;
    if (j < 0 || j >= db.groups.length) return;
    [db.groups[idx], db.groups[j]] = [db.groups[j], db.groups[idx]];
    persist(); renderHome();
  };
  menuSheet(`${g} 묶음`, [
    {
      label: '이름 바꾸기', icon: I.edit, onClick: () => promptSheet({
        title: '묶음 이름 바꾸기', label: '묶음 이름', value: g, ok: '저장',
        onOk: (name) => {
          const err = groupNameError(name, g);
          if (err) return err;
          db.groups[idx] = name;
          db.calcs.forEach((c) => { if (c.group === g) c.group = name; });
          if (db.prefs.groupFilter === g) db.prefs.groupFilter = name;
          persist(); renderHome();
        },
      }),
    },
    ...(idx > 0 ? [{ label: '앞으로 이동', icon: I.up, onClick: () => move(-1) }] : []),
    ...(idx < db.groups.length - 1 ? [{ label: '뒤로 이동', icon: I.down, onClick: () => move(1) }] : []),
    '-',
    {
      label: '묶음 삭제', icon: I.trash, danger: true, onClick: async () => {
        const n = db.calcs.filter((c) => c.group === g).length;
        const ok = await confirmDialog({ title: '묶음 삭제', message: n ? `“${g}” 묶음을 삭제합니다. 안에 있는 계산기 ${n}개는 지워지지 않고 미분류로 옮겨집니다.` : `“${g}” 묶음을 삭제합니다.`, ok: '삭제', danger: true });
        if (!ok) return;
        db.groups.splice(db.groups.indexOf(g), 1);
        db.calcs.forEach((c) => { if (c.group === g) c.group = ''; });
        if (db.prefs.groupFilter === g) db.prefs.groupFilter = '';
        persist(); renderHome();
        toast('묶음 삭제 완료');
      },
    },
  ]);
}
function moveGroupSheet(c) {

function cardMenu(id) {
  const c = getCalc(id);
  if (!c) return;
  // 순서 이동은 화면에 보이는 같은 목록(묶음이 있으면 같은 묶음) 안에서 바로 옆 카드와 자리를 바꿈
  const peers = db.groups.length ? db.calcs.filter((x) => (x.group || '') === (c.group || '')) : db.calcs;
  const idx = peers.indexOf(c);
  const move = (d) => {
    const o = peers[idx + d];
    if (!o) return;
    const i = db.calcs.indexOf(c), j = db.calcs.indexOf(o);
    [db.calcs[i], db.calcs[j]] = [db.calcs[j], db.calcs[i]];
    persist(); render();
  };
  menuSheet(c.name, [
    { label: '편집', icon: I.edit, onClick: () => go('#/edit/' + c.id) },

    ...(idx > 0 ? [{ label: '앞으로 이동', icon: I.up, onClick: () => move(-1) }] : []),
    ...(idx < peers.length - 1 ? [{ label: '뒤로 이동', icon: I.down, onClick: () => move(1) }] : []),

function duplicateCalc(c) {
  const copy = clone(c);
  copy.id = uid();
  copy.name = c.name + ' (복사본)';
  copy.createdAt = Date.now();
  for (const list of ['items', 'materials', 'inputs', 'outputs']) if (copy[list]) copy[list].forEach((x) => { x.id = uid(); });
  db.calcs.splice(db.calcs.indexOf(c) + 1, 0, copy);
  persist();
  toast('복제 완료');
  return copy;
}
async function deleteCalc(c, after) {
  const ok = await confirmDialog({ title: '계산기 삭제', message: `“${c.name}” 계산기와 등록된 품목·원료를 삭제합니다. 삭제 후에는 되돌릴 수 없습니다.`, ok: '삭제', danger: true });

async function exportBackup() {
  const data = { app: 'custom-calculator', version: 1, exportedAt: new Date().toISOString(), groups: db.groups, calcs: db.calcs };
  const json = JSON.stringify(data, null, 2);
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  const filename = `계산기-백업-${stamp}.json`;
  // claude.ai 에서 열었을 때는 플랫폼의 다운로드 기능을 사용
  const dl = window.claude?.use ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename, data: json }); toast('백업 파일 저장 완료'); }
    catch (e) { if (e?.code !== 'declined') toast('이 화면에서는 파일 저장 불가', true); }
    return;
  }
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  // 브라우저가 실제로 저장했는지는 알 수 없으므로 "시작"까지만 알림
  toast('백업 파일 다운로드 시작 · 다운로드 폴더 확인');
}
/** 불러온 계산기 하나를 검사·정리. 쓸 수 없으면 null */
function sanitizeCalc(c) {
  if (!c || typeof c !== 'object' || !TYPES[c.type] || typeof c.name !== 'string' || !c.name.trim()) return null;
  const num = (v) => { const n = typeof v === 'number' ? v : evalInput(v).value; return Number.isFinite(n) ? n : null; };
  const str = (v) => (typeof v === 'string' ? v : typeof v === 'number' ? String(v) : '');
  const id = (v) => (typeof v === 'string' && v ? v : uid());
  const group = str(c.group).trim().slice(0, 20);
  const out = {
    id: id(c.id), type: c.type, name: c.name.trim().slice(0, 40), desc: str(c.desc).slice(0, 60),
    group: group === NO_GROUP ? '' : group, decimals: clamp(Math.round(num(c.decimals) ?? 2), 0, 8), createdAt: num(c.createdAt) ?? Date.now(),
  };
  if (num(c.updatedAt) !== null) out.updatedAt = num(c.updatedAt);
  const named = (list, field) => (Array.isArray(list) ? list : [])
    .filter((x) => x && typeof x.name === 'string' && x.name.trim() && num(x[field]) !== null)
    .map((x) => ({ id: id(x.id), name: x.name.trim(), [field]: num(x[field]) }));
  if (c.type === 'convert') {
    if (!Array.isArray(c.items)) return null;
    Object.assign(out, { labelA: str(c.labelA) || '입력', unitA: str(c.unitA), labelB: str(c.labelB) || '환산', unitB: str(c.unitB), items: named(c.items, 'factor') });
  } else if (c.type === 'blend') {
    if (!Array.isArray(c.materials)) return null;
    Object.assign(out, { propName: str(c.propName) || '함량', amountUnit: str(c.amountUnit), materials: named(c.materials, 'value') });
  } else {
    if (!Array.isArray(c.inputs) || !Array.isArray(c.outputs)) return null;
    out.inputs = c.inputs.filter((x) => x && typeof x === 'object').map((x) => {
      if (x.kind === 'table') {
        const cols = (Array.isArray(x.cols) ? x.cols : []).filter((col) => col && ID_RE.test(str(col.key))).map((col) => ({ id: id(col.id), key: str(col.key), label: str(col.label), unit: str(col.unit) }));
        const rows = (Array.isArray(x.rows) ? x.rows : []).filter((r) => r && typeof r.name === 'string' && r.name.trim())
          .map((r) => ({ id: id(r.id), name: r.name.trim(), vals: cols.map((_, j) => num(Array.isArray(r.vals) ? r.vals[j] : null)) }));
        return { id: id(x.id), kind: 'table', key: str(x.key), label: str(x.label), unit: '', cols, rows };
      }
      return ID_RE.test(str(x.key)) ? { id: id(x.id), key: str(x.key), label: str(x.label) || str(x.key), unit: str(x.unit) } : null;
    }).filter(Boolean);
    out.outputs = c.outputs.filter((o) => o && ID_RE.test(str(o.key)) && typeof o.formula === 'string')
      .map((o) => ({ id: id(o.id), key: str(o.key), label: str(o.label) || str(o.key), unit: str(o.unit), formula: o.formula }));
    if (!out.outputs.length) return null;
  }
  return out;
}
document.getElementById('importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  let calcs, groups = [], skipped = 0;
  try {
    const data = JSON.parse(await file.text());
    if (Array.isArray(data.groups)) groups = data.groups.filter((g) => typeof g === 'string' && g.trim() && g.trim() !== NO_GROUP).map((g) => g.trim().slice(0, 20));
    const list = Array.isArray(data) ? data : Array.isArray(data.calcs) ? data.calcs : [];
    calcs = list.map(sanitizeCalc).filter(Boolean);
    skipped = list.length - calcs.length;
    // 파일 안에서 id 가 겹치면 새로 매김
    const seen = new Set();
    calcs.forEach((c) => { if (seen.has(c.id)) c.id = uid(); seen.add(c.id); });
  } catch { calcs = null; }
  if (!calcs || !calcs.length) return toast('불러올 수 있는 계산기가 없는 파일', true);
  const fresh = () => calcs.map((c) => {
    const x = clone(c);
    if (db.calcs.some((y) => y.id === x.id)) x.id = uid();
    return x;
  });
  openSheet({
    title: '백업 불러오기',
    html: `<p>백업 파일에서 계산기 ${calcs.length}개를 찾았습니다. 불러오는 방식을 고릅니다.</p>${skipped ? `<p class="help">형식이 맞지 않는 계산기 ${skipped}개는 제외됩니다.</p>` : ''}`,
    actions: [
      {
        label: '전체 바꾸기', kind: 'danger', onClick: () => {
          // 기존 계산기가 모두 지워지므로 한 번 더 확인하고, 바꾼 뒤에도 되돌릴 수 있게 함
          confirmDialog({
            title: '전체 바꾸기',
            message: `지금 있는 계산기 ${db.calcs.length}개를 모두 지우고 백업의 계산기 ${calcs.length}개로 바꿉니다. 바꾼 직후 알림의 "되돌리기"로 되돌릴 수 있습니다.`,
            ok: '전체 바꾸기', danger: true,
          }).then((ok) => {
            if (!ok) return;
            const before = clone({ calcs: db.calcs, groups: db.groups, session: db.session });
            try { localStorage.setItem(`${STORE_KEY}.before-import`, JSON.stringify(before)); } catch { /* 무시 */ }
            db.calcs = clone(calcs); db.groups = groups.slice(); db.session = {}; syncGroups(); persist(); render();
            toast('백업으로 바꾸기 완료', false, { label: '되돌리기', onClick: () => { Object.assign(db, before); syncGroups(); persist(); render(); toast('바꾸기 전으로 되돌림'); } });
          });
          return false;   // 확인창이 이 창 자리를 이어받음
        },
      },
      { label: '기존에 추가', kind: 'primary', onClick: () => { db.groups.push(...groups); db.calcs.push(...fresh()); syncGroups(); persist(); render(); toast(`계산기 ${calcs.length}개 추가 완료`); } },
    ],
  });
});

/* =========================================================
   계산기 화면
   ========================================================= */
function renderCalc(c, entering = false) {
  const s = session(c);
  // 숫자를 넣을 칸이 없으면 키패드와 키패드 버튼을 숨김
  const canType = c.type === 'blend' || (c.type === 'convert' ? c.items.length > 0 : c.inputs.some((x) => x.kind !== 'table'));
  const kp = keypadOn() && canType;
  const editLabel = manageLabel(c);
  const hint = isTouch() ? '식 입력(10+5 등)은 키패드 버튼 사용' : '입력칸에 10+5 같은 식을 써도 계산됩니다.';
  $app.innerHTML = `
    <div class="shell">
      <header class="topbar">
        <button class="icon-btn plain" data-act="up-home" aria-label="뒤로">${I.back}</button>
        <h1>${esc(c.name)}</h1>
        ${canType ? `<button class="icon-btn" data-act="toggle-keypad" aria-pressed="${kp}" aria-label="키패드 ${kp ? '숨기기' : '보이기'}" title="키패드 ${kp ? '숨기기' : '보이기'}">${I.keypad}</button>` : ''}
        <button class="icon-btn" data-act="edit-calc" aria-label="${editLabel}" title="${editLabel}">${I.edit}</button>
      </header>
      <section class="device" aria-label="${esc(c.name)}">
        <div class="lcd" id="lcd" aria-live="polite"></div>
        <div class="panel" id="panel">${calcPanel(c, s)}</div>
        ${kp ? keypadHTML() : ''}
      </section>
      ${kp || !canType ? '' : `<p class="key-hint">${hint}</p>`}
    </div>`;
  applyInputMode();
  updateCalc(c);
  // 첫 진입 시 커서 위치. 새로 그린 입력칸은 커서가 맨 앞이라 누른 숫자가 기존 값 앞에 붙으므로
  // 화면에 들어올 때는 값 전체 선택(바로 덮어쓰기), 같은 화면에서 다시 그릴 때는 끝으로 예약
  const target = calcUI.activeId && document.getElementById(calcUI.activeId);
  const el = target || firstCalcInput();
  setActive(el);
  calcUI.caret = el ? { id: el.id, all: entering } : null;
  if (!isTouch() && document.activeElement === document.body) el?.focus({ preventScroll: true });
  if (el && document.activeElement === el) applyCaret(el);
}
/** renderCalc 에서 예약한 커서 위치를 처음 입력할 때 한 번 적용 */
function applyCaret(el) {
  const p = calcUI?.caret;
  if (!p || p.id !== el.id) return;
  calcUI.caret = null;
  const n = el.value.length;
  try { el.setSelectionRange(p.all ? 0 : n, n); } catch { /* 무시 */ }
}
/** 편집 화면으로 가는 버튼 이름: 환산형 "품목 관리", 배합형 "원료 관리", 수식형 "계산기 편집" */
function manageLabel(c) { return c.type === 'convert' ? '품목 관리' : c.type === 'blend' ? '원료 관리' : '계산기 편집'; }
function applyInputMode() {
  const none = keypadOn() && isTouch();
  $app.querySelectorAll('.panel input[data-calc]').forEach((el) => el.setAttribute('inputmode', none ? 'none' : 'decimal'));
}
function firstCalcInput() {
  const els = [...$app.querySelectorAll('.panel input[data-calc]')];
  return els.find((e) => !e.value) || els[0] || null;
}
function getActiveInput() {
  const el = calcUI && calcUI.activeId && document.getElementById(calcUI.activeId);
  return el && document.contains(el) ? el : firstCalcInput();
}
function setActive(el) {
  $app.querySelectorAll('.input-wrap.active').forEach((w) => w.classList.remove('active'));

function inputField(id, value, unit, attrs = '', sm = false) {

function calcPanel(c, s) {
  if (c.type === 'convert') {
    if (!c.items.length) {
      return `<div class="notice"><span>등록된 품목 없음<br>품목별 기준값(1 ${esc(c.unitA)} 당 ${esc(c.unitB)})을 먼저 등록합니다.</span>

    // 항목이 많으면 칩은 최근 사용한 것만, 나머지는 검색으로
    const chipItems = many

        ${c.items.length > 5 ? `<div style="margin-top:8px">${comboHTML('cb-item', 'item', '', cur ? cur.name : '', '품목 검색 (초성 가능: ㅇㄷ → 원단)')}</div>` : ''}
        <div class="chips" role="radiogroup" aria-labelledby="itemsLabel" style="margin-top:10px">

          <button class="chip add" data-act="quick-add" aria-label="품목 추가">${I.plus}<span>추가</span></button>

      <div class="dir${s.src === 'b' ? ' up' : ''}" id="cv-dir" aria-hidden="true">${I.arrow}</div>
      <div>
        <div class="field-label"><span>${esc(c.labelB || '환산')}</span></div>

  if (c.type === 'formula') {
    if (!c.inputs.length) return `<div class="notice"><span>입력 항목 없음</span><button class="btn primary sm" data-act="edit-calc">${I.edit}계산기 편집</button></div>`;
    return `
      <div class="panel-head"><h2>입력</h2><button class="link-btn" data-act="clear-all">모두 지우기</button></div>
      ${c.inputs.map((inp) => inp.kind === 'table' ? `
        <div>
          <div class="field-label"><span>${esc(inp.label || '항목')}</span><span class="key-tag">${inp.cols.map((col) => esc(col.key)).join(' · ')}</span></div>

            ? comboHTML('fxt-' + inp.id, 'tbl', inp.id, inp.rows.find((r) => r.id === s.picks[inp.id])?.name || '', `${inp.label || '항목'} 선택 (초성 검색 가능)`)
            : '<div class="notice">등록된 항목 없음 · 계산기 편집에서 추가</div>'}

        </div>` : `
        <div>
          <div class="field-label"><span>${esc(inp.label || inp.key)}</span><span class="key-tag">${esc(inp.key)}</span></div>

  }
  // blend
  return `
    <div class="panel-head"><h2>원료 · 투입량</h2><button class="link-btn" data-act="edit-calc">원료 관리</button></div>

          ${row.mat === 'custom' ? `<div class="custom">${inputField('bl-c-' + row.id, row.custom, '%', `data-row="${row.id}" data-bfield="custom" aria-label="${i + 1}번 ${esc(c.propName)} %"`, true)}</div>` : ''}
          <div class="amount">${inputField('bl-a-' + row.id, row.amount, c.amountUnit, `data-row="${row.id}" data-bfield="amount" aria-label="${i + 1}번 투입량"`, true)}</div>

      <button class="btn sm" data-act="row-add" style="flex:1">${I.plus}원료 추가</button>
      <button class="btn sm ghost" data-act="clear-all">모두 지우기</button>
    </div>`;
}

/* ---------- 검색 자동완성 (콤보박스) ---------- */
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const choOf = (ch) => { const k = ch.charCodeAt(0) - 0xAC00; return k >= 0 && k < 11172 ? CHO[Math.floor(k / 588)] : ch.toLowerCase(); };
const isCho = (ch) => ch >= 'ㄱ' && ch <= 'ㅎ';
/** label 안에서 q 를 찾음. 초성(ㅇㄷ)과 글자를 섞어 써도 됨. 못 찾으면 null */
function findMatch(label, q) {
  const L = [...label];
  const Q = [...q.toLowerCase()];
  if (!Q.length) return { at: 0, len: 0 };
  outer: for (let i = 0; i + Q.length <= L.length; i++) {
    for (let j = 0; j < Q.length; j++) {
      const a = L[i + j], b = Q[j];
      if (isCho(b) ? (choOf(a) !== b && a !== b) : a.toLowerCase() !== b) continue outer;
    }
    return { at: i, len: Q.length };
  }
  return null;
}
function highlight(label, m) {
  if (!m || !m.len) return esc(label);
  const L = [...label];
  return esc(L.slice(0, m.at).join('')) + '<mark>' + esc(L.slice(m.at, m.at + m.len).join('')) + '</mark>' + esc(L.slice(m.at + m.len).join(''));
}
/** 표 입력의 한 항목 값 요약: "밀도 1.2 g/cm³ · 두께 0.5 mm" */
function tblRowText(inp, r) {
  return inp.cols.map((col, j) => `${col.label || col.key} ${fmt(numOrNaN(r.vals[j]), 6)}${col.unit ? ' ' + col.unit : ''}`).join(' · ');
}
function matLabel(c, row) {
  if (row.mat === 'custom') return '직접 입력';
  return c.materials.find((m) => m.id === row.mat)?.name || '';
}
function comboHTML(id, kind, row, label, placeholder, sm = false) {
  return `<div class="combo${sm ? ' sm' : ''}" data-combo="${kind}" data-row="${row}" data-label="${esc(label)}">
    <div class="combo-field">${sm ? '' : I.search}<input id="${id}" class="combo-input" type="text" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="${id}-list" aria-label="${esc(placeholder)}" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" placeholder="${esc(placeholder)}" value="${esc(label)}">${I.chev.replace('<svg', '<svg style="width:16px;height:16px;color:var(--muted);flex:none"')}</div>
    <ul class="combo-list" id="${id}-list" role="listbox" hidden></ul>
  </div>`;
}
function comboContext(combo) {
  const c = getCalc(parseRoute().id);
  if (!c) return null;
  const s = session(c);
  const kind = combo.dataset.combo;
  const row = kind === 'mat' ? s.rows.find((r) => r.id === combo.dataset.row) : null;
  const tbl = kind === 'tbl' ? c.inputs.find((x) => x.id === combo.dataset.row) : null;
  const cur = kind === 'item' ? s.itemId : kind === 'tbl' ? s.picks[combo.dataset.row] : row?.mat;
  return { c, s, kind, row, tbl, cur };
}
function renderComboList(input) {
  const combo = input.closest('.combo');
  const ctx = comboContext(combo);
  if (!ctx) return;
  const { c, kind, cur, tbl } = ctx;
  const q = input.value.trim();
  combo._q = q;
  const base = kind === 'item'
    ? c.items.map((it) => ({ v: it.id, label: it.name, sub: `${fmt(numOrNaN(it.factor), 6)} ${c.unitB}/${c.unitA}` }))
    : kind === 'tbl'
      ? tbl.rows.map((r) => ({ v: r.id, label: r.name, sub: tblRowText(tbl, r) }))
      : c.materials.map((m) => ({ v: m.id, label: m.name, sub: `${fmt(numOrNaN(m.value), 4)}%` }));
  const matched = [];
  for (const o of base) { const m = findMatch(o.label, q); if (m) matched.push({ ...o, m }); }
  matched.sort((a, b) => a.m.at - b.m.at);
  const exact = q && base.some((o) => o.label.toLowerCase() === q.toLowerCase());
  const specials = [];
  if (kind === 'mat') specials.push({ v: 'custom', label: '직접 입력', sub: `${c.propName} %를 직접 입력` });
  if (!exact && kind !== 'tbl') specials.push({ v: '__new', label: q ? `“${q}” ${kind === 'item' ? '새 품목으로' : '새 원료로'} 등록` : `+ ${kind === 'item' ? '새 품목' : '새 원료'} 등록` });
  const shown = matched.slice(0, 80);
  const all = [...shown, ...specials.map((o) => ({ ...o, special: true }))];
  combo._opts = all;
  const list = combo.querySelector('.combo-list');
  let sel = q ? 0 : Math.max(0, all.findIndex((o) => o.v === cur));
  if (q && !shown.length) sel = all.length - 1;
  list.innerHTML = (q && !matched.length ? `<li class="combo-empty">‘${esc(q)}’ 와 맞는 항목 없음</li>` : '')
    + all.map((o, i) => `<li class="combo-opt${o.special ? ' special' : ''}" role="option" id="${list.id}-${i}" data-i="${i}" aria-selected="${i === sel}"><b>${o.special ? esc(o.label) : highlight(o.label, o.m)}</b>${o.sub ? `<small>${esc(o.sub)}</small>` : ''}${o.v === cur ? I.check : ''}</li>`).join('')
    + (matched.length > shown.length ? `<li class="combo-empty">${matched.length - shown.length}개 더 있음 · 검색어 추가 입력</li>` : '');
  list.hidden = false;
  input.setAttribute('aria-expanded', 'true');
  setComboSel(combo, sel, !q);
}
function setComboSel(combo, i, center = false) {
  const opts = combo.querySelectorAll('.combo-opt');
  if (!opts.length) return;
  i = (i + opts.length) % opts.length;
  opts.forEach((o, k) => o.setAttribute('aria-selected', String(k === i)));
  combo._sel = i;
  combo.querySelector('.combo-input').setAttribute('aria-activedescendant', opts[i].id);
  const list = combo.querySelector('.combo-list');
  const el = opts[i];
  if (center) list.scrollTop = el.offsetTop - list.clientHeight / 2 + el.clientHeight / 2;
  else if (el.offsetTop < list.scrollTop) list.scrollTop = el.offsetTop;
  else if (el.offsetTop + el.offsetHeight > list.scrollTop + list.clientHeight) list.scrollTop = el.offsetTop + el.offsetHeight - list.clientHeight;
}
function closeCombo(combo, restore = true) {
  const input = combo.querySelector('.combo-input');
  combo.querySelector('.combo-list').hidden = true;
  input.setAttribute('aria-expanded', 'false');
  input.removeAttribute('aria-activedescendant');
  if (restore) input.value = combo.dataset.label;
}
function pushRecent(s, id) { s.recent = [id, ...(s.recent || []).filter((x) => x !== id)].slice(0, 8); }
function chooseCombo(combo, i) {
  const ctx = comboContext(combo);
  const o = combo._opts?.[i];
  if (!ctx || !o) return;
  const { c, s, kind, row } = ctx;
  const q = combo._q || '';
  closeCombo(combo);
  combo.querySelector('.combo-input').blur();
  if (kind === 'item') {
    if (o.v === '__new') return quickAddItem(c, (item) => { s.itemId = item.id; pushRecent(s, item.id); renderCalc(c); }, q);
    s.itemId = o.v;
    pushRecent(s, o.v);
    persist();
    renderCalc(c);
  } else if (kind === 'tbl') {
    s.picks[combo.dataset.row] = o.v;
    persist();
    renderCalc(c);
  } else {
    setRowMat(c, row, o.v, q);
  }
}
function setRowMat(c, row, v, q = '') {
  if (!row) return;
  if (v === '__new') return quickAddItem(c, (m) => { row.mat = m.id; persist(); renderCalc(c); }, q);
  row.mat = v;
  persist();
  calcUI.activeId = v === 'custom' ? 'bl-c-' + row.id : 'bl-a-' + row.id;
  renderCalc(c);
  if (!isTouch()) document.getElementById(calcUI.activeId)?.focus();
}

/** 입력값이 바뀔 때마다 결과(LCD)와 연동 칸만 갱신 (입력칸은 다시 그리지 않음 → 커서 유지) */
function updateCalc(c) {
  const s = session(c);
  const d = c.decimals ?? 2;
  const lcd = document.getElementById('lcd');
  if (!lcd) return;
  const copyBtn = (val) => (Number.isFinite(val) ? `<button class="lcd-copy" data-act="copy" data-val="${plain(val, d)}" aria-label="결과 복사" title="결과 복사">${I.copy}</button>` : '');
  const rowCopy = (val, label) => (Number.isFinite(val) ? `<button class="row-copy" data-act="copy" data-val="${plain(val, d)}" aria-label="${esc(label)} 복사" title="${esc(label)} 복사">${I.copy}</button>` : '');
  // reason: 결과를 낼 수 없을 때 이유
  const main = (val, unit, state, reason = '') => {
    if (state === 'err') return `<div class="lcd-main err"><span class="num">입력 오류</span></div>`;
    const ok = Number.isFinite(val);
    return `<div class="lcd-main${ok && state !== 'dim' ? '' : ' dim'}"><span class="num">${ok ? fmt(val, d) : (state === 'na' ? '—' : '0')}</span>${unit ? `<span class="unit">${esc(unit)}</span>` : ''}</div>${reason ? `<div class="lcd-reason">${esc(reason)}</div>` : ''}`;
  };

  if (c.type === 'convert') {
    const item = c.items.find((i) => i.id === s.itemId);
    const f = item ? numOrNaN(item.factor) : NaN;
    const srcUnit = s.src === 'a' ? c.unitA : c.unitB;
    const dstUnit = s.src === 'a' ? c.unitB : c.unitA;
    const v = evalInput(s.src === 'a' ? s.a : s.b);
    const out = v.ok ? (s.src === 'a' ? v.value * f : v.value / f) : NaN;
    const other = document.getElementById(s.src === 'a' ? 'cv-b' : 'cv-a');
    if (other) other.value = v.ok && Number.isFinite(out) ? fmt(out, d) : '';
    const srcEl = document.getElementById(s.src === 'a' ? 'cv-a' : 'cv-b');
    srcEl?.closest('.input-wrap').classList.toggle('bad', !!v.error);
    document.getElementById('cv-dir')?.classList.toggle('up', s.src === 'b');
    const reason = v.ok && !Number.isFinite(out) ? (item ? `기준값(${fmt(f, 6)})으로 환산 불가 · 품목 관리에서 기준값 확인` : '품목 선택 필요') : '';
    lcd.innerHTML = `
      <div class="lcd-top"><span>${item ? esc(item.name) : '품목 없음'}</span><span>${item ? `1 ${esc(c.unitA)} = ${fmt(f, 6)} ${esc(c.unitB)}` : ''}</span></div>
      <div class="lcd-expr">${v.ok ? `${fmt(v.value, 6)} ${esc(srcUnit)} =` : ''}</div>
      ${v.error ? main(NaN, '', 'err') : main(out, dstUnit, v.ok ? (Number.isFinite(out) ? '' : 'na') : 'dim', reason)}
      ${copyBtn(out)}`;
    return;
  }

  if (c.type === 'formula') {
    const env = Object.create(null);
    let anyErr = false, anyEmpty = false, anyUnpicked = false;
    for (const inp of c.inputs) {
      if (inp.kind === 'table') {
        const row = inp.rows.find((r) => r.id === s.picks[inp.id]);
        inp.cols.forEach((col, j) => { env[col.key] = row ? numOrNaN(row.vals[j]) : NaN; });
        if (!row) anyUnpicked = true;
        const meta = document.getElementById('fxm-' + inp.id);
        if (meta) meta.textContent = row ? tblRowText(inp, row) : '';
        continue;
      }
      const r = evalInput(s.vals[inp.id] || '');
      document.getElementById('fx-' + inp.id)?.closest('.input-wrap').classList.toggle('bad', !!r.error);
      if (r.error) anyErr = true;
      if (r.empty) anyEmpty = true;
      env[inp.key] = r.ok ? r.value : NaN;
    }
    const results = c.outputs.map((o) => {
      let val = NaN;
      const comp = compile(o.formula);
      if (comp.ok) { try { val = evalAst(comp.ast, env); } catch { val = NaN; } }
      env[o.key] = val;
      return { o, val };
    });
    const waiting = anyEmpty || anyUnpicked;
    const [first, ...rest] = results;
    const state = anyErr ? 'err' : waiting ? 'dim' : (first && !Number.isFinite(first.val) ? 'na' : '');
    const reason = state === 'na' ? '계산 불가 · 0으로 나누기, 음수의 제곱근 등 계산식 확인' : '';
    lcd.innerHTML = first ? `
      <div class="lcd-top"><span>${esc(first.o.label || first.o.key)}</span><span>${anyEmpty ? '값 입력 필요' : anyUnpicked ? '항목 선택 필요' : ''}</span></div>
      <div class="lcd-expr"></div>
      ${main(waiting ? NaN : first.val, first.o.unit, state, reason)}
      ${rest.length ? `<div class="lcd-rows">${rest.map((r) => `<div class="lcd-row"><span>${esc(r.o.label || r.o.key)}</span><b>${waiting ? '—' : fmt(r.val, d)} ${esc(r.o.unit || '')}</b>${waiting || anyErr ? '' : rowCopy(r.val, r.o.label || r.o.key)}</div>`).join('')}</div>` : ''}
      ${waiting || anyErr ? '' : copyBtn(first.val)}`
      : '<div class="lcd-top"><span>결과 항목 없음</span></div><div class="lcd-expr"></div>' + main(NaN, '', 'dim');
    return;
  }

  // blend
  let total = 0, part = 0, complete = 0, partial = 0, anyErr = false;
  for (const row of s.rows) {
    const mat = c.materials.find((m) => m.id === row.mat);
    const pv = row.mat === 'custom' ? evalInput(row.custom) : { ok: !!mat && Number.isFinite(numOrNaN(mat.value)), value: mat ? numOrNaN(mat.value) : NaN };
    const av = evalInput(row.amount);
    document.getElementById('bl-a-' + row.id)?.closest('.input-wrap').classList.toggle('bad', !!av.error);
    document.getElementById('bl-c-' + row.id)?.closest('.input-wrap').classList.toggle('bad', !!pv.error);
    if (av.error || pv.error) anyErr = true;
    const meta = document.getElementById('bm-' + row.id);
    if (av.ok && pv.ok) {
      const w = av.value * pv.value / 100;
      total += av.value; part += w; complete++;
      if (meta) meta.textContent = `${c.propName} ${fmt(pv.value, 4)}% → ${fmt(w, d)} ${c.amountUnit}`;
    } else {
      if (!av.empty || (row.mat === 'custom' && row.custom)) partial++;
      if (meta) meta.textContent = pv.ok ? `${c.propName} ${fmt(pv.value, 4)}%` : row.mat === 'custom' ? `${c.propName} % 입력 필요` : !row.mat && !av.empty ? '원료 선택 필요' : '';
    }
  }
  const pct = total > 0 ? part / total * 100 : NaN;
  const state = anyErr ? 'err' : complete ? (Number.isFinite(pct) ? '' : 'na') : 'dim';
  const reason = state === 'na' ? '총 투입량 0 · 투입량 확인' : state === 'dim' && partial ? '원료와 투입량을 모두 넣은 줄부터 계산' : '';
  lcd.innerHTML = `
    <div class="lcd-top"><span>배합 ${esc(c.propName)}</span><span>${partial ? `미완성 ${partial}행 제외` : `${complete}종 배합`}</span></div>
    <div class="lcd-expr"></div>
    ${main(complete ? pct : NaN, '%', state, reason)}
    <div class="lcd-rows">
      <div class="lcd-row"><span>총 투입량</span><b>${complete ? fmt(total, d) : '—'} ${esc(c.amountUnit)}</b>${complete && !anyErr ? rowCopy(total, '총 투입량') : ''}</div>
      <div class="lcd-row"><span>${esc(c.propName)}량</span><b>${complete ? fmt(part, d) : '—'} ${esc(c.amountUnit)}</b>${complete && !anyErr ? rowCopy(part, c.propName + '량') : ''}</div>

}

/** 계산기 입력칸의 값이 바뀌었을 때 세션에 반영 */
function onCalcInput(c, el) {
  const s = session(c);
  if (c.type === 'convert') {
    s.src = el.dataset.side;
    s[s.src] = el.value;
  } else if (c.type === 'formula') {
    s.vals[el.dataset.inp] = el.value;
  } else {
    const row = s.rows.find((r) => r.id === el.dataset.row);
    if (row) row[el.dataset.bfield] = el.value;
  }
  updateCalc(c);
  persistSoon();
}
/** 식(10+5)을 결과 숫자로 확정 */
function commitExpr(c, el) {
  const r = evalInput(el.value);
  if (r.ok && r.expr) {
    el.value = plain(r.value, Math.max(6, c.decimals ?? 2));
    onCalcInput(c, el);
  }
}
function nextCalcInput(el) {
  const els = [...$app.querySelectorAll('.panel input[data-calc]')];
  const i = els.indexOf(el);
  return els[i + 1] || null;
}

function keypadPress(c, key) {
  if (key === 'AC') return clearAll(c);
  const el = getActiveInput();
  if (!el) return;
  if (document.activeElement !== el) {
    el.focus({ preventScroll: true });
    // 휴대폰에서 아래 고정 키패드에 가려진 칸이면 보이게
    if (isTouch()) el.scrollIntoView({ block: 'nearest' });
  }
  applyCaret(el);
  setActive(el);
  const v = el.value;
  let s = el.selectionStart ?? v.length, e = el.selectionEnd ?? v.length;
  if (key === '=') { commitExpr(c, el); return; }
  let nv = v, caret;
  if (key === 'C') { nv = ''; caret = 0; }
  else if (key === 'back') {
    if (s !== e) { nv = v.slice(0, s) + v.slice(e); caret = s; }
    else if (s > 0) { nv = v.slice(0, s - 1) + v.slice(s); caret = s - 1; }
    else return;
  } else {
    // 결과값(다른 칸에 자동 입력된 쉼표 숫자)을 이어서 편집할 때 쉼표 제거
    if (/,/.test(v)) { const raw = v.replace(/,/g, ''); const all = s === 0 && e === v.length; s = all ? 0 : raw.length; e = raw.length; nv = raw; }
    nv = nv.slice(0, s) + key + nv.slice(e);
    caret = s + key.length;
  }
  el.value = nv;
  try { el.setSelectionRange(caret, caret); } catch { /* 무시 */ }
  onCalcInput(c, el);
}
function clearAll(c) {
  const s = session(c);
  const had = c.type === 'convert' ? !!(s.a || s.b) : c.type === 'formula' ? Object.values(s.vals).some(Boolean)
    : s.rows.length > 1 || s.rows.some((r) => r.mat || r.amount || r.custom);
  const before = clone(s);
  if (c.type === 'convert') { s.a = ''; s.b = ''; s.src = 'a'; }
  else if (c.type === 'formula') s.vals = {};
  else s.rows = [newBlendRow(c)];
  persist();
  calcUI.activeId = null;
  renderCalc(c);
  // 잘못 눌러도 원료 줄 구성·투입량을 되살릴 수 있게 5초 동안 되돌리기
  if (had) toast('모두 지움', false, { label: '되돌리기', onClick: () => {
    db.session[c.id] = before; persist();
    if (parseRoute().name === 'calc' && parseRoute().id === c.id) renderCalc(c);
  } });
}

function quickAddItem(c, onAdded, presetName = '') {

  openSheet({
    title: isBlend ? '새 원료 등록' : '새 품목 등록', html,

      {

          const name = nameEl.value.trim();
          const v = evalInput(valEl.value);
          nameEl.classList.toggle('invalid', !name);
          valEl.closest('.input-wrap').classList.toggle('invalid', !v.ok);
          if (!name) { nameEl.focus(); return false; }
          if (!v.ok) { valEl.focus(); return false; }
          const rangeErr = isBlend ? (v.value < 0 || v.value > 100 ? '함량은 0~100% 범위' : '') : (v.value <= 0 ? '기준값은 0보다 큰 수' : '');
          if (rangeErr) { valEl.closest('.input-wrap').classList.add('invalid'); toast(rangeErr, true); valEl.focus(); return false; }
          const list = isBlend ? c.materials : c.items;
          if (list.some((x) => x.name === name)) { nameEl.classList.add('invalid'); toast('같은 이름이 이미 있음', true); nameEl.focus(); return false; }
          const item = { id: uid(), name, [isBlend ? 'value' : 'factor']: v.value };
          (isBlend ? c.materials : c.items).push(item);
          c.updatedAt = Date.now();
          onAdded(item);

  return { ...base, propName: '고형분', amountUnit: 'kg', materials: [{ id: uid(), name: '', value: '' }] };

function nextKey(d, prefix) {
  const used = new Set([...inputKeys(d.inputs), ...d.inputs.map((x) => String(x.key).trim()), ...d.outputs.map((x) => String(x.key).trim())]);
  if (prefix === 'in') {
    for (const ch of 'ABCDEFGHIJKLMNOPQSTUVWXYZ') if (!used.has(ch)) return ch;
    let i = 1; while (used.has('X' + i)) i++; return 'X' + i;
  }
  let i = 1; while (used.has('R' + i)) i++; return 'R' + i;
}

function getPath(obj, path) { return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj); }
function setPath(obj, path, val) {

      <div class="full kind-line" role="group" aria-label="입력 방식">
        <button type="button" class="seg" data-act="in-kind" data-i="${i}" data-kind="num" aria-pressed="${!table}">숫자 입력</button>
        <button type="button" class="seg" data-act="in-kind" data-i="${i}" data-kind="table" aria-pressed="${table}">표에서 선택</button>
      </div>
      ${table ? tableEditor(x, i) : ''}
    </div>`;
}
function tableEditor(x, i) {
  const n = x.cols.length;
  const colName = (col) => esc(col.label || col.key || '값');
  return `
    <div class="full tbl-block">
      <div class="tbl-head">값 열 · 키는 계산식에 사용</div>
      ${x.cols.map((col, j) => `
        <div class="tbl-col">
          <input class="txt key-input" ${bindAttr(`inputs.${i}.cols.${j}.key`, 'aria-label="열 키" maxlength="12" data-key-field')}>
          <input class="txt" ${bindAttr(`inputs.${i}.cols.${j}.label`, 'placeholder="열 이름 (예: 밀도)" aria-label="열 이름"')}>
          <input class="txt" ${bindAttr(`inputs.${i}.cols.${j}.unit`, 'placeholder="단위" aria-label="열 단위"')}>
          <button type="button" class="mini-btn del" data-act="tcol-del" data-i="${i}" data-j="${j}" aria-label="열 삭제" ${n <= 1 ? 'disabled' : ''}>${I.trash}</button>
        </div>`).join('')}
      <div class="sec-actions"><button type="button" class="btn sm" data-act="tcol-add" data-i="${i}">${I.plus}열 추가</button></div>
      <div class="tbl-head">항목</div>
      ${x.rows.length ? x.rows.map((r, k) => `
        <div class="tbl-row" style="--n:${n}">
          <input class="txt" ${bindAttr(`inputs.${i}.rows.${k}.name`, 'placeholder="항목 이름" aria-label="항목 이름"')}>
          ${x.cols.map((col, j) => `<input class="txt" ${bindAttr(`inputs.${i}.rows.${k}.vals.${j}`, `inputmode="decimal" placeholder="${colName(col)}" aria-label="${colName(col)}"`)}>`).join('')}
          <button type="button" class="mini-btn del" data-act="trow-del" data-i="${i}" data-k="${k}" aria-label="항목 삭제">${I.trash}</button>
        </div>`).join('') : '<div class="row-empty">등록된 항목 없음</div>'}
      <div class="sec-actions">
        <button type="button" class="btn sm" data-act="trow-add" data-i="${i}">${I.plus}항목 추가</button>
        <button type="button" class="btn sm ghost" data-act="paste" data-list="tbl" data-i="${i}">${I.clipboard}엑셀에서 붙여넣기</button>
      </div>
    </div>`;
}

/* ---------- 시험 계산 (저장 전 결과 확인, 저장되지 않음) ---------- */
function testInputsHTML(d) {
  const t = editor.test;
  const field = (key, unit, label) => `<label class="f"><span>${esc(label)}</span><div class="input-wrap sm"><input data-test="${key}" inputmode="decimal" placeholder="0" autocomplete="off" value="${esc(t[key] || '')}" aria-label="${esc(label)}">${unit ? `<span class="unit">${esc(unit)}</span>` : ''}</div></label>`;
  const pick = (key, label, opts) => `<label class="f"><span>${esc(label)}</span><select class="select" data-test="${key}" aria-label="${esc(label)}"><option value="">선택</option>${opts.map((o) => `<option value="${o.v}" ${t[key] === o.v ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select></label>`;
  if (d.type === 'convert') {
    return pick('item', '품목', d.items.filter((x) => x.name.trim()).map((x) => ({ v: x.id, label: x.name.trim() }))) + field('a', d.unitA, d.labelA || '입력');
  }
  if (d.type === 'formula') {
    return d.inputs.map((x) => (x.kind === 'table'
      ? pick('p:' + x.id, x.label || '항목', x.rows.filter((r) => r.name.trim()).map((r) => ({ v: r.id, label: r.name.trim() })))
      : field('v:' + x.id, x.unit, x.label || x.key))).join('');
  }
  return d.materials.filter((m) => m.name.trim()).map((m) => field('m:' + m.id, d.amountUnit, `${m.name.trim()} 투입량`)).join('') || '<div class="row-empty">등록된 원료 없음</div>';
}
/** rebuild: 품목·입력이 바뀌었으면 시험 입력칸도 다시 그림 (시험 칸에 입력 중일 때는 제외) */
function refreshTest(rebuild = false) {
  const out = $app.querySelector('#testOut');
  if (!out || !editor) return;
  const d = editor.draft, t = editor.test;
  if (rebuild) {
    const box = $app.querySelector('#testIn');
    if (box && !box.contains(document.activeElement)) box.innerHTML = testInputsHTML(d);
  }
  const dec = d.decimals ?? 2;
  const row = (label, val, unit, main = false) => `<div class="t-row${main ? ' t-main' : ''}"><span>${esc(label)}</span><b>${Number.isFinite(val) ? fmt(val, dec) : '—'}${unit ? ' ' + esc(unit) : ''}</b></div>`;
  const note = (msg) => `<div class="t-note">${esc(msg)}</div>`;
  const run = (formula, env) => { const comp = compile(formula); if (!comp.ok) return { ok: false, val: NaN }; try { return { ok: true, val: evalAst(comp.ast, env) }; } catch { return { ok: true, val: NaN }; } };
  let html;
  if (d.type === 'convert') {
    const it = d.items.find((x) => x.id === t.item);
    const a = evalInput(t.a || '');
    html = !it ? note('품목 선택 후 값 입력') : !a.ok ? note('값 입력') : row(`${fmt(a.value, 6)} ${d.unitA} =`, a.value * evalInput(it.factor).value, d.unitB, true);
  } else if (d.type === 'formula') {
    const env = Object.create(null);
    let waiting = false;
    for (const x of d.inputs) {
      if (x.kind === 'table') {
        const r = x.rows.find((y) => y.id === t['p:' + x.id]);
        if (!r) waiting = true;
        x.cols.forEach((col, j) => { env[String(col.key).trim()] = r ? evalInput(r.vals[j]).value : NaN; });
      } else {
        const v = evalInput(t['v:' + x.id] || '');
        if (!v.ok) waiting = true;
        env[String(x.key).trim()] = v.value;
      }
    }
    html = waiting ? note('입력값을 모두 넣으면 결과 표시') : d.outputs.map((o, i) => {
      const r = run(o.formula, env);
      env[String(o.key).trim()] = r.val;
      return r.ok ? row(o.label || o.key, r.val, o.unit, i === 0) : row(`${o.label || o.key} · 계산식 오류`, NaN, '');
    }).join('');
  } else {
    let total = 0, part = 0, n = 0;
    for (const m of d.materials) {
      const a = evalInput(t['m:' + m.id] || ''), v = evalInput(m.value);
      if (a.ok && v.ok) { total += a.value; part += a.value * v.value / 100; n++; }
    }
    html = !n ? note('원료별 투입량 입력') : row(`배합 ${d.propName || '함량'}`, total > 0 ? part / total * 100 : NaN, '%', true) + row('총 투입량', total, d.amountUnit);
  }
  out.innerHTML = html;
}

/** 수식형 키 검사. 실시간 검사와 저장 검사가 같은 기준(앞뒤 공백 제거)을 씀 */
function keyProblems(d) {
  const entries = [];
  d.inputs.forEach((x, i) => {
    if (x.kind === 'table') x.cols.forEach((col, j) => entries.push([`inputs.${i}.cols.${j}.key`, col.key]));
    else entries.push([`inputs.${i}.key`, x.key]);
  });
  d.outputs.forEach((x, i) => entries.push([`outputs.${i}.key`, x.key]));
  const seen = new Set();
  const out = [];
  for (const [path, raw] of entries) {
    const k = String(raw).trim();
    let msg = '';
    if (!ID_RE.test(k)) msg = `키 '${k || '(빈칸)'}' 사용 불가 · 영문/한글로 시작 필요`;
    else if (FN[k] || k in CONST) msg = `'${k}' 는 함수 이름이라 키로 사용 불가`;
    else if (seen.has(k)) msg = `키 '${k}' 중복`;
    seen.add(k);
    if (msg) out.push({ path, msg });
  }
  return out;
}
/** 수식형: 각 계산식 아래 변수 칩과 검증 메시지, 키 검사 결과 갱신 */
function refreshFormulaMsgs() {
  const d = editor.draft;
  const probs = keyProblems(d);
  $app.querySelectorAll('[data-key-field]').forEach((el) => el.classList.toggle('invalid', probs.some((p) => p.path === el.dataset.bind)));
  $app.querySelectorAll('[data-keymsg]').forEach((el) => { el.textContent = probs.find((p) => p.path.startsWith(el.dataset.keymsg + '.'))?.msg || ''; });
  const inKeys = inputKeys(d.inputs);
  d.outputs.forEach((o, i) => {
    const known = [...inKeys, ...d.outputs.slice(0, i).map((x) => String(x.key).trim())].filter((k) => ID_RE.test(k));
    const varsEl = $app.querySelector(`[data-vars="${i}"]`);
    if (varsEl) {
      varsEl.innerHTML = known.map((k) => `<button type="button" class="var-chip" data-act="ins" data-i="${i}" data-text="${esc(k)}">${esc(k)}</button>`).join('')
        + ['+', '−', '×', '÷', '(', ')'].map((op) => `<button type="button" class="var-chip op" data-act="ins" data-i="${i}" data-text="${{ '−': '-', '×': '*', '÷': '/' }[op] || op}" aria-label="${op}">${op}</button>`).join('');
    }
    const msgEl = $app.querySelector(`[data-fmsg="${i}"]`);
    if (!msgEl) return;
    const r = checkFormula(o.formula, known);
    msgEl.className = 'fmsg full ' + (r.ok ? 'ok' : o.formula.trim() ? 'err' : '');
    msgEl.textContent = r.ok ? '✓ 올바른 식' : (o.formula.trim() ? r.error : '변수 버튼을 눌러 식을 만들 수 있습니다');
  });
}
function checkFormula(formula, known) {
  if (!String(formula).trim()) return { ok: false, error: '계산식 입력 필요' };
  const c = compile(formula);
  if (!c.ok) return { ok: false, error: c.error };
  const unknown = [...c.vars].filter((v) => !known.includes(v) && !(v in CONST));
  if (unknown.length) return { ok: false, error: `'${unknown.join(', ')}' 는 없는 키` };
  return { ok: true };
}

function validateDraft(d) {
  const fail = (error, focus) => ({ ok: false, error, focus });
  const out = clone(d);
  out.name = out.name.trim();
  out.desc = (out.desc || '').trim();
  out.group = String(out.group || '').trim().slice(0, 20);
  if (!out.name) return fail('계산기 이름 입력 필요', 'name');
  if (out.group === NO_GROUP) return fail('사용할 수 없는 묶음 이름', 'group');
  if (d.type === 'convert') {
    out.unitA = out.unitA.trim(); out.unitB = out.unitB.trim();
    out.labelA = out.labelA.trim() || '입력'; out.labelB = out.labelB.trim() || '환산';
    if (!out.unitA) return fail('입력 단위 입력 필요', 'unitA');
    if (!out.unitB) return fail('환산 단위 입력 필요', 'unitB');
    const items = [];
    for (let i = 0; i < d.items.length; i++) {
      const it = d.items[i];
      const name = it.name.trim();
      if (!name && !String(it.factor).trim()) continue;
      if (!name) return fail(`${i + 1}번째 품목 이름 입력 필요`, `items.${i}.name`);
      if (items.some((x) => x.name === name)) return fail(`품목 이름 “${name}” 중복`, `items.${i}.name`);
      const v = evalInput(it.factor);
      if (!v.ok) return fail(`“${name}” 기준값을 숫자로 입력 필요`, `items.${i}.factor`);
      if (v.value <= 0) return fail(`“${name}” 기준값은 0보다 커야 함`, `items.${i}.factor`);
      items.push({ id: it.id, name, factor: v.value });
    }
    out.items = items;
  } else if (d.type === 'blend') {
    out.propName = out.propName.trim() || '함량';
    out.amountUnit = out.amountUnit.trim();
    const mats = [];
    for (let i = 0; i < d.materials.length; i++) {
      const m = d.materials[i];
      const name = m.name.trim();
      if (!name && !String(m.value).trim()) continue;
      if (!name) return fail(`${i + 1}번째 원료 이름 입력 필요`, `materials.${i}.name`);
      if (mats.some((x) => x.name === name)) return fail(`원료 이름 “${name}” 중복`, `materials.${i}.name`);
      const v = evalInput(m.value);
      if (!v.ok) return fail(`“${name}” 함량을 숫자로 입력 필요`, `materials.${i}.value`);
      if (v.value < 0 || v.value > 100) return fail(`“${name}” 함량은 0~100% 범위`, `materials.${i}.value`);
      mats.push({ id: m.id, name, value: v.value });
    }
    out.materials = mats;
  } else {
    if (!d.inputs.length) return fail('입력 항목 1개 이상 필요');
    if (!d.outputs.length) return fail('결과 항목 1개 이상 필요');
    const kp = keyProblems(d);
    if (kp.length) return fail(kp[0].msg, kp[0].path);
    out.inputs = [];
    for (let i = 0; i < d.inputs.length; i++) {
      const x = d.inputs[i];
      if (x.kind !== 'table') { out.inputs.push({ id: x.id, key: x.key.trim(), label: x.label.trim() || x.key.trim(), unit: x.unit.trim() }); continue; }
      const label = x.label.trim();
      if (!label) return fail(`${i + 1}번째 입력(표) 이름 입력 필요`, `inputs.${i}.label`);
      const cols = x.cols.map((col) => ({ id: col.id, key: col.key.trim(), label: col.label.trim() || col.key.trim(), unit: col.unit.trim() }));
      const rows = [];
      for (let k = 0; k < x.rows.length; k++) {
        const r = x.rows[k];
        const name = r.name.trim();
        if (!name && r.vals.every((v) => !String(v).trim())) continue;
        if (!name) return fail(`“${label}” ${k + 1}번째 항목 이름 입력 필요`, `inputs.${i}.rows.${k}.name`);
        if (rows.some((y) => y.name === name)) return fail(`“${label}” 항목 이름 “${name}” 중복`, `inputs.${i}.rows.${k}.name`);
        const vals = [];
        for (let j = 0; j < cols.length; j++) {
          const v = evalInput(r.vals[j]);
          if (!v.ok) return fail(`“${name}” ${cols[j].label} 값을 숫자로 입력 필요`, `inputs.${i}.rows.${k}.vals.${j}`);
          vals.push(v.value);
        }
        rows.push({ id: r.id, name, vals });
      }
      if (!rows.length) return fail(`“${label}” 표에 항목 없음 · 항목 추가 필요`, `inputs.${i}.label`);
      out.inputs.push({ id: x.id, kind: 'table', key: String(x.key || '').trim(), label, unit: '', cols, rows });
    }
    const inKeys = inputKeys(out.inputs);
    for (let i = 0; i < d.outputs.length; i++) {
      const o = d.outputs[i];
      const known = [...inKeys, ...d.outputs.slice(0, i).map((x) => x.key.trim())];
      const r = checkFormula(o.formula, known);
      if (!r.ok) return fail(`“${o.label || o.key}” 계산식: ${r.error}`, `outputs.${i}.formula`);
    }
    out.outputs = d.outputs.map((o) => ({ id: o.id, key: o.key.trim(), label: o.label.trim() || o.key.trim(), unit: o.unit.trim(), formula: o.formula.trim() }));
  }
  return { ok: true, calc: out };
}

function saveEditor() {
  $app.querySelectorAll('.invalid').forEach((e) => e.classList.remove('invalid'));
  const res = validateDraft(editor.draft);
  if (!res.ok) {
    toast(res.error, true);
    const el = res.focus && $app.querySelector(`[data-bind="${res.focus}"]`);
    if (el) {
      (el.closest('.input-wrap') || el).classList.add('invalid');
      el.focus();
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
    return;
  }
  const calc = res.calc;
  calc.updatedAt = Date.now();
  const prev = getCalc(calc.id);
  if (prev) {
    // 새로 추가된 품목이 있으면 계산기로 돌아갔을 때 바로 선택
    if (calc.type === 'convert') {
      const added = calc.items.filter((x) => !prev.items.some((p) => p.id === x.id));
      if (added.length) { const s = db.session[calc.id] || (db.session[calc.id] = {}); s.itemId = added[added.length - 1].id; }
    }
    db.calcs[db.calcs.indexOf(prev)] = calc;
  } else {
    calc.createdAt = Date.now();
    db.calcs.push(calc);
  }
  syncGroups();
  if (calc.type === 'blend' && db.session[calc.id]?.rows) {
    // 지운 원료를 고른 줄은 "원료 선택" 상태로
    db.session[calc.id].rows.forEach((r) => { if (r.mat && r.mat !== 'custom' && !calc.materials.some((m) => m.id === r.mat)) r.mat = ''; });
  }
  persist();
  const wasNew = editor.isNew;
  const back = editor.from || '#/calc/' + calc.id;
  dropEditor();
  toast(storageOk ? '저장 완료' : '화면에만 반영 · 브라우저 저장 실패', !storageOk);
  if (wasNew) replaceRoute('#/calc/' + calc.id);
  else up(back);
}

const confirmDiscard = () => confirmDialog({ title: '저장하지 않고 나가기', message: '변경한 내용이 사라집니다.', ok: '나가기', danger: true });
async function leaveEditor() {
  if (editor?.dirty && !(await confirmDiscard())) return;
  if (!editor) return;
  const d = editor.draft;
  const isNew = editor.isNew;
  const from = editor.from;
  dropEditor();
  // 들어온 화면으로 돌아감 (휴대폰 뒤로가기와 같은 결과)
  up(from || (isNew ? '#/' : '#/calc/' + d.id));
}
/** 고친 내용이 있는 편집 화면을 뒤로가기 등으로 벗어나려 할 때 (주소는 편집 화면으로 되돌린 상태) */
async function confirmLeave(to) {
  if (!(await confirmDiscard())) return;
  dropEditor();
  up(to);
}

/** list: 'items' | 'materials' | 'tbl'(수식형 표 입력, ti 번째) */
function openPaste(list, ti) {
  const d = editor.draft;
  const tbl = list === 'tbl' ? d.inputs[ti] : null;
  const isItems = list === 'items';
  const n = tbl ? tbl.cols.length : 1;
  const colNames = tbl ? tbl.cols.map((col) => col.label || col.key).join(', ') : isItems ? '기준값' : '함량(%)';
  const sample = tbl ? `제품 A\t${tbl.cols.map((_, j) => (j + 1) * 1.5).join('\t')}` : isItems ? '원단 C\t11.2\n원단 D\t1000/80' : '바인더 Y\t42\n증점제\t5';
  const info = (r) => `${r.rows.length}개 인식${r.bad ? ` · ${r.bad}줄 인식 불가` : ''}`;
  openSheet({
    title: '엑셀에서 붙여넣기',
    html: `<p>엑셀에서 <b>이름</b>과 <b>${esc(colNames)}</b> 열을 복사해 붙여넣습니다. 한 줄에 하나씩이며 탭·쉼표로 구분해도 됩니다. 1000/80 같은 식도 입력할 수 있습니다.</p>
      <textarea class="txt" id="pasteBox" placeholder="${esc(sample)}"></textarea>
      <p class="help" id="pasteInfo">0개 인식</p>`,
    onMount: (el) => {
      const box = el.querySelector('#pasteBox');
      box.addEventListener('input', () => { el.querySelector('#pasteInfo').textContent = info(parsePaste(box.value, n)); });
    },
    actions: [
      { label: '취소' },
      {
        label: '추가', kind: 'primary', onClick: (el) => {
          const { rows, bad } = parsePaste(el.querySelector('#pasteBox').value, n);
          if (!rows.length) { toast('인식된 줄 없음', true); return false; }
          let added = 0, changed = 0;
          if (tbl) {
            const arr = tbl.rows.filter((x) => x.name.trim() || x.vals.some((v) => String(v).trim()));
            rows.forEach(([name, ...vals]) => {
              const v = tbl.cols.map((_, j) => vals[j] ?? '');
              const ex = arr.find((x) => x.name.trim() === name);
              if (ex) { ex.vals = v; changed++; } else { arr.push({ id: uid(), name, vals: v }); added++; }
            });
            tbl.rows = arr;
          } else {
            const key = isItems ? 'factor' : 'value';
            const arr = d[list].filter((x) => x.name.trim() || String(x[key]).trim());
            rows.forEach(([name, v]) => {
              const ex = arr.find((x) => x.name.trim() === name);
              if (ex) { ex[key] = v; changed++; } else { arr.push({ id: uid(), name, [key]: v }); added++; }
            });
            d[list] = arr;
          }
          editor.dirty = true;
          renderEditor();
          // 같은 이름은 값을 바꾸므로 몇 개를 바꿨는지 함께 알림
          toast(`새 항목 ${added}개 · 값 변경 ${changed}개${bad ? ` · 인식 불가 ${bad}줄` : ''} · 저장 후 적용`);
        },
      },
    ],
  });
}
/** 붙여넣은 글을 [이름, 값1..값n] 줄로 나눔. 단위처럼 숫자가 아닌 칸은 건너뜀 */
function parsePaste(text, n = 1) {
  const rows = [];
  let bad = 0;
  const numCell = (s) => {
    const t = String(s).trim().replace(/%$/, '').trim();
    if (!t) return null;
    const v = evalInput(t);
    return v.ok ? String(v.value) : null;
  };
  for (const line of String(text).split(/\r?\n/)) {
    const t = line.trim();
    if (!t) continue;
    let name, cells;
    if (t.includes('\t') || t.includes(';')) {
      const parts = t.split(t.includes('\t') ? '\t' : ';');
      name = parts[0]; cells = parts.slice(1);
    } else if (t.includes(',')) {
      // 첫 쉼표로 이름을 나눔. 값이 하나면 나머지는 통째로(1,000 같은 천 단위 쉼표 유지)
      const m = /^(.*?)\s*,\s*(.*)$/.exec(t);
      name = m[1]; cells = n > 1 ? m[2].split(',') : [m[2]];
    } else {
      const toks = t.split(/\s+/);
      let k = toks.length;
      const vals = [];
      while (k > 1 && vals.length < n && numCell(toks[k - 1]) !== null) vals.unshift(toks[--k]);
      name = toks.slice(0, k).join(' '); cells = vals;
    }
    name = String(name || '').trim().replace(/^"|"$/g, '').trim();
    const vals = cells.map(numCell).filter((v) => v !== null).slice(0, n);
    if (!name || !vals.length) { bad++; continue; }
    rows.push([name, ...vals]);
  }
  return { rows, bad };
}

function insertAtCursor(input, text) {
  // 아직 계산식 칸을 누르지 않았으면 맨 앞이 아니라 끝에 넣음
  const focused = document.activeElement === input;
  const s = focused ? (input.selectionStart ?? input.value.length) : input.value.length;
  const e = focused ? (input.selectionEnd ?? s) : s;
  const before = input.value.slice(0, s), after = input.value.slice(e);
  const pad = /^[A-Za-z0-9_가-힣]/.test(text) && /[A-Za-z0-9_가-힣)]$/.test(before) ? ' ' : '';
  const ins = (/[+\-*/]/.test(text) && text.length === 1) ? ` ${text} ` : pad + text;
  input.value = (before + ins + after).replace(/ {2,}/g, ' ');
  const caret = Math.min(input.value.length, (before + ins).replace(/ {2,}/g, ' ').length);
  input.focus();
  input.setSelectionRange(caret, caret);
  input.dispatchEvent(new Event('input', { bubbles: true }));
}
/** 키 이름을 바꾸면 계산식 안의 같은 키도 함께 바꿈 */
function renameKeyInFormulas(d, from, to) {
  const re = new RegExp(`(?<![A-Za-z0-9_가-힣])${from}(?![A-Za-z0-9_가-힣])`, 'g');
  let n = 0;
  d.outputs.forEach((o) => { const f = o.formula.replace(re, () => { n++; return to; }); o.formula = f; });
  return n;
}

  // ---- 계산기 ----
  if (r.name === 'calc') {
    const c = getCalc(r.id);
    if (!c) return;
    const s = session(c);
    if (act === 'up-home') return up('#/');
    if (act === 'edit-calc') return go('#/edit/' + c.id);
    if (act === 'toggle-keypad') { db.prefs.keypad = !keypadOn(); persist(); return renderCalc(c); }
    if (act === 'copy') return copyText(b.dataset.val);
    if (act === 'clear-all') return clearAll(c);
    if (act === 'pick-item') {
      s.itemId = b.dataset.id;

      $app.querySelectorAll('[data-act="pick-item"]').forEach((x) => x.setAttribute('aria-checked', String(x === b)));
      const cb = $app.querySelector('.combo[data-combo="item"]');
